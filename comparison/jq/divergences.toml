[[divergence]]
id = "robust:deep-tojson-built-1000"
category = "by-design"
reason = "`tojson` of a value built 1000 levels deep: jq answers; succinctly raises `nesting depth exceeds limit of 384` (exit 5) for a value it built itself. The ceiling stays since #5497, which aligned parsing and printing with jq: lifting it is a design of its own (ADR-0025), recorded in the Nesting depth section of docs/compliance/jq/limitations.md."

[[divergence]]
id = "robust:deep-tojson-built-10000"
category = "by-design"
reason = "Same as deep-tojson-built-1000, at 10000 levels. The ceiling stays since #5497, which aligned parsing and printing with jq: lifting it is a design of its own (ADR-0025), recorded in the Nesting depth section of docs/compliance/jq/limitations.md."

[[divergence]]
id = "robust:deep-tojson-built-20000"
category = "by-design"
