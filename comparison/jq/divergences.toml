[[divergence]]
id = "robust:recursion-depth-10000"
category = "by-design"
reason = "A user-defined function recursing 10000 deep: jq answers (about 3 s); succinctly's stack guard refuses with `exceeded maximum recursion depth` (ADR-0025)."

[[divergence]]
id = "robust:recursion-depth-100000"
category = "by-design"
reason = "Recursion 100000 deep: jq does not finish within 10 s; succinctly's stack guard refuses (ADR-0025)."

[[divergence]]
id = "robust:recursion-tail-100000"
category = "by-design"
reason = "Tail-position recursion 100000 deep: jq does not finish within 10 s; succinctly's stack guard refuses (ADR-0025), so it gets no tail-call elimination."

[[divergence]]
id = "robust:regex-many-matches"
category = "reference-slow"
reason = "`[match(\"a\";\"g\")]` over 100000 characters: jq 1.7.1 does not finish within 10 s on an M4 Pro (5.7 s on a 7950X); succinctly answers in tens of milliseconds. Whether jq beats the deadline depends on the host (it timed out on an M4 Pro and on a GitHub-hosted x86_64 Linux runner, #5565)."
volatile = true

[[divergence]]
id = "robust:regex-gsub-large"
category = "reference-slow"
reason = "`gsub(\"a\";\"b\")` over 100000 characters: jq 1.7.1 does not finish within 10 s; succinctly answers in tens of milliseconds."

[[divergence]]
id = "robust:array-set-too-huge-index"
category = "reference-crash"
reason = "`[] | .[1e12] = 1`: jq aborts (SIGSEGV); succinctly refuses the index with an error (exit 5, #5500)."
