# Known differences from the reference jq (#5409). `succinctly dev compare jq` fails on a
# difference not listed here and on a listed one that no longer differs.
#
# id        <suite>:<probe>: features:name/arity, since-secondary:name/arity, cli:id, extensions:id
# platform  optional std::env::consts::OS the entry was observed on; other OSes neither expect nor call it stale
# volatile  optional true: whether the difference shows depends on the host's speed (a probe the reference
#           finishes inside the 10 s deadline on a fast machine only); expected where it shows, not stale where it does not
# category  by-design | host-dependent | newer-than-primary | reference-crash | reference-slow | to-triage
#           (to-triage: a real difference nobody has yet classified against ADR-0018 or filed)
# issue     optional tracking issue. A branch that references a `to-triage` entry's issue deletes the entry in
#           the same change (scripts/ledger_refs.py, #5585); one that only mentions it says `[ledger keeps #N]`
#           on its own line in a commit message

[[divergence]]
id = "features:get_jq_origin/0"
category = "host-dependent"
reason = "Prints the directory of the running binary, so the two tools differ by installation path alone."

[[divergence]]
id = "features:strftime/1"
category = "reference-crash"
reason = "jq 1.7.1 aborts (`Assertion failed: JVP_HAS_KIND(j, JV_KIND_STRING)`, jv.c:1370) on a non-string format; succinctly reports a catchable error."

[[divergence]]
id = "features:strflocaltime/1"
