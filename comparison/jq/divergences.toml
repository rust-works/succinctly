[[divergence]]
id = "robust:mem-limit-string-bomb"
platform = "linux"
category = "reference-crash"
reason = "`\"a\" * 1e9` under `ulimit -v` 512 MiB: jq 1.7.1 aborts; succinctly exits 5 with a graceful error."

[[divergence]]
id = "robust:mem-limit-64m-string"
platform = "linux"
category = "by-design"
issue = "#5665"
reason = "Under `ulimit -v` 64 MiB a 20 MB string is read by jq but aborts succinctly on a failed allocation. A trivial run already maps about 42 MiB (the binary, the main thread's 8 MiB stack and the evaluation stack, 16 MiB at the least under a cap, #5634), and the document takes 28 MiB more: the input, and its index in two allocations of 2.5 MB and 5 MB. That is the semi-index kept whole beside the input, not a leak: it fits in 70 MiB on Linux aarch64."

[[divergence]]
id = "robust:mem-limit-alloc-bomb"
platform = "linux"
category = "by-design"
issue = "#5634"
reason = "`[range(1e8)] | length` under `ulimit -v` 512 MiB: jq 1.7.1 and succinctly both abort (killed by a signal, no exit status). Rust ends the process on a failed allocation (`memory allocation of N bytes failed`) where jq's `jv_mem_alloc` prints `cannot allocate memory` and aborts, so the output matches; a graceful error would need every container growth to be fallible."

# G: colour and locale probes (#5552). Found with the per-probe `env` column; none is tracked yet, so they are `to-triage`.
# JQ_COLORS: a field over the colour buffer rejects the whole variable in jq; an empty variable and a trailing empty field keep defaults.
# strptime/strftime: libc in jq (locale-dependent, `%B` strict, weekday from the unset date fields); a fixed English implementation here.

[[divergence]]
id = "cli:jqcolors-overlong"
category = "to-triage"
reason = "`JQ_COLORS` with a 30-digit field: jq 1.7.1 prints `Failed to set $JQ_COLORS` and keeps every default colour; succinctly applies the long field to null."

[[divergence]]
id = "cli:jqcolors-many-semicolons"
category = "to-triage"
reason = "`JQ_COLORS=1;2;3;4;5;6;7;8;9` (one 17-byte field): jq 1.7.1 rejects the whole variable (`Failed to set $JQ_COLORS`) and keeps the defaults; succinctly applies it."

[[divergence]]
id = "cli:jqcolors-empty"
category = "to-triage"
reason = "`JQ_COLORS=` (set, empty): jq 1.7.1 keeps every default colour; succinctly sets the null colour to the empty string (`ESC[m`)."

[[divergence]]
id = "cli:jqcolors-empty-fields"
category = "to-triage"
reason = "`JQ_COLORS=:::` (four fields, the last empty): jq 1.7.1 applies the first three and leaves the number colour at its default `0;39`; succinctly also blanks the number colour."

[[divergence]]
id = "cli:locale-strftime-c-en-us"
category = "to-triage"
volatile = true
reason = "`strftime(\"%x\")` under `LC_ALL=en_US.UTF-8` is `03/05/2015` in jq 1.7.1 (libc) and `03/05/15` in succinctly, which has one fixed `%c`/`%x`/`%X` layout. Shows only where the host has that locale installed (a host without it falls back to `C`)."

[[divergence]]
id = "cli:locale-strptime-ampm-c"
category = "to-triage"
reason = "`\"11:30 PM\" | strptime(\"%I:%M %p\")`: the weekday (element 6) is 6 in jq 1.7.1 and 0 in succinctly. jq derives it from the unset date fields (`1900-01-00`) with its own formula; `\"12\"|strptime(\"%H\")` and `\"3\"|strptime(\"%d\")` differ the same way."

