# Known differences from the reference jq (#5409). `succinctly dev compare jq` fails on a
# difference not listed here and on a listed one that no longer differs.
#
# id        <suite>:<probe>: features:name/arity, since-secondary:name/arity, cli:id, extensions:id
# category  by-design | host-dependent | newer-than-primary | reference-crash | reference-slow | to-triage
#           (to-triage: a real difference nobody has yet classified against ADR-0018 or filed)

[[divergence]]
id = "features:get_jq_origin/0"
category = "host-dependent"
reason = "Prints the directory of the running binary, so the two tools differ by installation path alone."

[[divergence]]
id = "features:strftime/1"
category = "reference-crash"
reason = "jq 1.7.1 aborts (`Assertion failed: JVP_HAS_KIND(j, JV_KIND_STRING)`, jv.c:1370) on a non-string format; succinctly reports a catchable error."

[[divergence]]
id = "features:strflocaltime/1"
category = "reference-crash"
reason = "Same jq 1.7.1 assertion abort on a non-string format as strftime/1."

[[divergence]]
id = "features:strptime/1"
category = "host-dependent"
reason = "On `\"a\" | strptime(.)` the weekday of 1900-00-00 is 6 in jq 1.7.1 (libc) and 0 in succinctly; the value is platform-libc dependent (#5340)."

[[divergence]]
id = "since-secondary:add/1"
category = "newer-than-primary"
reason = "add(f) is new in jq 1.8; succinctly follows the 1.7.1 pin (ADR-0018)."

[[divergence]]
id = "since-secondary:trimstr/1"
category = "newer-than-primary"
reason = "trimstr(s) is new in jq 1.8; succinctly follows the 1.7.1 pin (ADR-0018)."

[[divergence]]
id = "since-secondary:have_decnum/0"
category = "newer-than-primary"
reason = "have_decnum is new in jq 1.8; succinctly follows the 1.7.1 pin (ADR-0018)."

[[divergence]]
id = "since-secondary:have_literal_numbers/0"
category = "newer-than-primary"
reason = "have_literal_numbers is new in jq 1.8; succinctly follows the 1.7.1 pin (ADR-0018)."

[[divergence]]
id = "cli:version"
category = "by-design"
reason = "`--version` names the tool (`succinctly jq ... 0.8.0`), not jq's version token."

[[divergence]]
id = "cli:help-exit"
category = "by-design"
reason = "`-h` prints succinctly's own usage text."

[[divergence]]
id = "cli:help-long-exit"
category = "by-design"
reason = "`--help` prints succinctly's own usage text."

[[divergence]]
id = "cli:build-configuration"
category = "by-design"
reason = "`--build-configuration` describes succinctly's build, not jq's configure line."

[[divergence]]
id = "cli:debug-dump-disasm"
category = "by-design"
reason = "succinctly has no bytecode to disassemble; the flag is rejected (exit 2)."

[[divergence]]
id = "cli:debug-trace"
category = "by-design"
reason = "succinctly has no bytecode to trace; the flag is rejected (exit 2)."

[[divergence]]
id = "cli:long-binary"
category = "to-triage"
reason = "jq accepts `-b`/`--binary` (a no-op outside Windows); succinctly rejects it (exit 2)."
issue = "#5474"

[[divergence]]
id = "cli:stream-errors"
category = "to-triage"
reason = "`--stream-errors` is not accepted (exit 2); jq 1.7.1 emits `[message, path]` for a truncated input."
issue = "#5474"

[[divergence]]
id = "cli:stream-slurp"
category = "to-triage"
reason = "`--stream -s` : jq 1.7.1 prints the stream's closing event as a separate value (`[[1]]`); succinctly folds it into the one slurped array."

[[divergence]]
id = "cli:color"
category = "to-triage"
reason = "`-C` colour escapes differ: jq 1.7.1 emits no reset after an opening bracket or comma, succinctly resets after each token."
issue = "#5473"

[[divergence]]
id = "cli:color-pretty"
category = "to-triage"
reason = "Same colour-escape difference as `cli:color`, in pretty-printed output."
issue = "#5473"

[[divergence]]
id = "cli:jq-colors"
category = "to-triage"
reason = "Same colour-escape difference as `cli:color`, for an array holding null."
issue = "#5473"

[[divergence]]
id = "cli:exit-error-continues"
category = "to-triage"
reason = "jq's exit status reflects only the last input (`1 {\"a\":2}` with `.a` exits 0 after the error on `1`); succinctly exits 5 if any input errored."
issue = "#5471"

[[divergence]]
id = "cli:files-missing-continues"
category = "to-triage"
reason = "jq reads the remaining files after one cannot be opened (and exits 2); succinctly stops at the first missing file."
issue = "#5472"

[[divergence]]
id = "upstream-jq.test:113"
category = "to-triage"
reason = "`{(0):1}`: jq rejects a constant non-string object key at compile time (exit 3); succinctly fails when the program runs (exit 5)."

[[divergence]]
id = "upstream-jq.test:117"
category = "to-triage"
reason = "`{non_const:., (0):1}`: same compile-time rejection of a constant non-string key as upstream-jq.test:113."

[[divergence]]
id = "upstream-onig.test:102"
category = "to-triage"
reason = "`gsub(\"(?=u)\"; \"u\")`: regex lookahead is refused as an invalid regex (Rust `regex` has no lookaround); jq's oniguruma supports it."

[[divergence]]
id = "robust:deep-array-length"
category = "to-triage"
reason = "`[..]|length` on 5000 nested arrays: succinctly answers (5000); jq refuses at its parse depth limit (`Exceeds depth limit for parsing`, exit 5). The lazy route does not apply a depth limit."

[[divergence]]
id = "robust:deep-array-parse-257"
category = "to-triage"
reason = "257 nested arrays: jq rejects past its 256-level parse limit (exit 5); succinctly's lazy route answers."

[[divergence]]
id = "robust:deep-array-parse-384"
category = "to-triage"
reason = "384 nested arrays: same as deep-array-parse-257; succinctly's own limit of 384 is not reached on this route."

[[divergence]]
id = "robust:deep-array-parse-385"
category = "to-triage"
reason = "385 nested arrays: same as deep-array-parse-257; succinctly answers although its own limit is 384."

[[divergence]]
id = "robust:deep-object-parse-257"
category = "to-triage"
reason = "257 nested objects: jq rejects past its 256-level parse limit (exit 5); succinctly's lazy route answers."

[[divergence]]
id = "robust:deep-object-parse-385"
category = "to-triage"
reason = "385 nested objects: same as deep-object-parse-257."

[[divergence]]
id = "robust:deep-array-print-5000"
category = "to-triage"
reason = "`.` on 5000 nested arrays: both refuse, jq at parse (`Exceeds depth limit for parsing`, exit 5), succinctly at 384 (`Error: nesting depth exceeds limit of 384`, exit 1)."

[[divergence]]
id = "robust:deep-tojson-built-1000"
category = "to-triage"
reason = "`tojson` of a value built 1000 levels deep: jq answers; succinctly raises `nesting depth exceeds limit of 384` (exit 5) for a value it built itself."

[[divergence]]
id = "robust:deep-tojson-built-10000"
category = "to-triage"
reason = "Same as deep-tojson-built-1000, at 10000 levels."

[[divergence]]
id = "robust:deep-tojson-built-20000"
category = "to-triage"
reason = "Same as deep-tojson-built-1000, at 20000 levels."

[[divergence]]
id = "robust:deep-built-equal"
category = "to-triage"
reason = "`==` on a value built 5000 levels deep: jq answers; succinctly raises the 384-level depth error."

[[divergence]]
id = "robust:deep-built-sort"
category = "to-triage"
reason = "`sort` over a value built 3000 levels deep: jq answers; succinctly raises the 384-level depth error."

[[divergence]]
id = "robust:error-deep-message"
category = "to-triage"
reason = "`error(<value built 2000 levels deep>)` caught and measured: jq answers; succinctly raises the 384-level depth error."

[[divergence]]
id = "robust:recursion-depth-10000"
category = "by-design"
reason = "A user-defined function recursing 10000 deep: jq answers (about 3 s); succinctly's stack guard refuses with `exceeded maximum recursion depth` (ADR-0025)."

[[divergence]]
id = "robust:recursion-depth-100000"
category = "by-design"
reason = "Recursion 100000 deep: jq does not finish within 10 s; succinctly's stack guard refuses (ADR-0025)."

[[divergence]]
id = "robust:recursion-tail-100000"
category = "by-design"
reason = "Tail-position recursion 100000 deep: jq does not finish within 10 s; succinctly's stack guard refuses (ADR-0025), so it gets no tail-call elimination."

[[divergence]]
id = "robust:regex-many-matches"
category = "reference-slow"
reason = "`[match(\"a\";\"g\")]` over 100000 characters: jq 1.7.1 does not finish within 10 s; succinctly answers in tens of milliseconds."

[[divergence]]
id = "robust:regex-gsub-large"
category = "reference-slow"
reason = "`gsub(\"a\";\"b\")` over 100000 characters: jq 1.7.1 does not finish within 10 s; succinctly answers in tens of milliseconds."

[[divergence]]
id = "robust:sigpipe-range"
category = "to-triage"
reason = "`range(10000000)` piped into `head -n1`: jq dies of SIGPIPE (shell status 141); succinctly exits 1."

[[divergence]]
id = "robust:sigpipe-input"
category = "to-triage"
reason = "`.[]` over a million-element array piped into `head -n1`: jq exits 141 (SIGPIPE); succinctly exits 1."

[[divergence]]
id = "robust:sigpipe-repeat"
category = "to-triage"
reason = "`repeat(1)` piped into `head -n1`: jq exits 141 (SIGPIPE); succinctly exits 1."

[[divergence]]
id = "robust:array-set-too-huge-index"
category = "to-triage"
reason = "`[] | .[1e12] = 1`: jq aborts (SIGSEGV); succinctly neither errors nor finishes within 10 s (it appears to allocate the index), and earlier runs ended in an abort. A refused index would be the safe answer."
