category = "newer-than-primary"
reason = "jq 1.7.1's own test `fromjson | isnan` on `\"nan1234\"` expects `true`: a NaN with a payload is an invalid numeric literal in jq 1.8 (CVE-2024-53427, \"Reject NaN with payload while parsing JSON\"), which dropped this case from its jq.test. succinctly follows 1.8 (#7522, docs/compliance/jq/limitations.md) and raises `Invalid numeric literal`, as jq 1.8.2 does."
issue = "7522"
