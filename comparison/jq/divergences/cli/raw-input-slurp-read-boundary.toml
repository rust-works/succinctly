reason = "A multi-byte character that straddles jq 1.7.1's 4095-byte fgets read of a raw-input line (`é` at byte 4094) is read as invalid UTF-8 and printed as two U+FFFD there; jq 1.8.2 fixed that as a bug (jqlang/jq#3389, fixed by jqlang/jq#3421) and keeps the character, as succinctly does. Here under `-R -s` (docs/compliance/jq/limitations.md)."
