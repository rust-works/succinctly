category = "newer-than-primary"
reason = "`--stream -s` over input with no trailing newline keeps the last closing event in the array in jq 1.8.2 (jqlang/jq#3279, a fix of the 1.7.1 slurp loop); jq 1.7.1 prints the array and then the held closing event as a second output (`[1,2]` gives `[[[0],1],[[1],2]]` then `[[1]]`). succinctly follows 1.8.2 (#7523), and for the fault at the end of the text too (#7807): `2[` under `--stream-errors -s` is `[[[],2],[\"Unfinished JSON term at EOF at line 1, column 2\",[0]]]`, where jq 1.7.1 prints `[[[],2]]` and then the fault event as a second output. The probe reads `--stream -s`; `scripts/jq-stream-errors-oracle-sweep.py` sets the same rows aside under `--stream-errors -s` (`oracle_reruns_slurped_program`, #7890)."
issue = "#7523"
