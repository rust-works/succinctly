category = "host-dependent"
issue = "#5753"
reason = "`\"11:30 PM\" | strptime(\"%I:%M %p\")`: the weekday (element 6) is 6 in jq 1.7.1 on macOS and 0 in succinctly. It is the platform libc's weekday and yearday of a format that sets no date (docs/compliance/jq/limitations.md, \"`strptime` weekday and yearday of a format that sets no date\", #5340, #5383): jq's macOS build derives it from the unset date (`1900-01-00`) with its own `set_tm_wday()`, glibc leaves jq's `8`/`367` sentinels, and succinctly answers the date's own weekday. `\"12\"|strptime(\"%H\")` and `\"3\"|strptime(\"%d\")` differ the same way."
