category = "by-design"
reason = "Tail-position recursion 100000 deep: jq does not finish within 10 s; succinctly's stack guard refuses (ADR-0025), so it gets no tail-call elimination. The refusal is not immediate, so whether it arrives inside the 10 s deadline depends on the host's speed, and a run records either class for succinctly: `error` (exit 5) where it does, as on an Apple M4 Pro, and `timeout` where it does not, as on an AMD Ryzen 9 7950X under Linux (#7891)."
reference_class = "timeout"
subject_class = ["error", "timeout"]
