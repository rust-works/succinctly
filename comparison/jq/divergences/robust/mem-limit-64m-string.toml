platform = "linux"
category = "by-design"
issue = "#5665"
reason = "Under `ulimit -v` 64 MiB a 20 MB string is read by jq but aborts succinctly on a failed allocation. A trivial run already maps about 42 MiB (the binary, the main thread's 8 MiB stack and the evaluation stack, 16 MiB at the least under a cap, #5634), and the document takes 28 MiB more: the input, and its index in two allocations of 2.5 MB and 5 MB. That is the semi-index kept whole beside the input, not a leak: it fits in 70 MiB on Linux aarch64. How the run fails under the cap depends on how much memory the build maps, and a run records either class: a build that maps a little more stops at the read of the input and exits 2 with `jq: error: out of memory`, and one that maps less gets past that read to an index allocation that is not guarded and aborts (`memory allocation of N bytes failed`, killed by a signal). jq answers in both cases, so the entry stands for either."
