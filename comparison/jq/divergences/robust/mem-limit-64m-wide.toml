reason = "Under `ulimit -v` 64 MiB, 300000-key object: the reference jq 1.7.1 aborts on x86_64 Linux; succinctly answers, on an evaluation stack sized to the cap (#5634). Whether jq aborts depends on the host's address-space footprint, not its architecture: the object needs about 60 MiB of the 64, so jq answers on Linux aarch64 (Neoverse-V2, 124 ms) and aborts below a 60000 KiB cap there too (Ubuntu 24.04 jq 1.7, `linux/arm64`, 4 KiB pages). The entry is volatile so that a host where jq fits is not called stale (#7009)."
volatile = true
