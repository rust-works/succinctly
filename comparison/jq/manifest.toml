# Pinned inputs for `succinctly dev compare jq` (#5409).
#
# Everything the comparison measures against is named here; the harness never
# uses whatever `jq` is on PATH. Add a [[reference]] to compare another tool.

schema_version = 1

# jq 1.7.1 is the primary reference (tests/data/jq-golden/JQ_VERSION, ADR-0018).
[[reference]]
id = "jq-1.7.1"
version = "1.7.1"
role = "primary"
source_url = "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-1.7.1.tar.gz"
source_sha256 = "478c9ca129fd2e3443fe27314b455e211e0d8c60bc8ff7df703873deeee580c2"

# jq 1.8.1 is secondary: the builtins new in 1.8.x are probed against 1.8.1
# alone (the `since-1.8.1` suite) and, in later phases, timed and measured
# against it too. It is never counted as a divergence in the 1.7.1 columns.
[[reference]]
id = "jq-1.8.1"
version = "1.8.1"
role = "secondary"
source_url = "https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-1.8.1.tar.gz"
source_sha256 = "2be64e7129cecb11d5906290eba10af694fb9e3e7f9fc208a311dc33ca837eb0"

# The build under test. `--all-features` is not a superset build (CLAUDE.md, #3006).
[succinctly]
profile = "release"
features = "cli,simd,regex,serde"

[corpus]
manifest = "tests/data/bench-corpus/manifest.json"

[queries]
smoke = "comparison/jq/queries/smoke.tsv"

# Dimension A (builtins) derives its probes from the reference's own `builtins`;
# these are the data for G (CLI) and the succinctly-only surface.
[probes]
cli = "comparison/jq/probes/cli.tsv"
extensions = "comparison/jq/probes/extensions.tsv"
fixtures = "comparison/jq/fixtures"
divergences = "comparison/jq/divergences.toml"

# Upstream test files, vendored from the jq 1.7.1 source tarball (MIT; see
# vendor/jq-1.7.1/COPYING) and run as a differential (dimension B).
[[suite]]
id = "upstream-jq.test"
path = "comparison/jq/vendor/jq-1.7.1/jq.test"
sha256 = "35aade216e95e78e63e77011fb4588856a5d04d6ac7be572ad382a3430d8b4d5"

[[suite]]
id = "upstream-onig.test"
path = "comparison/jq/vendor/jq-1.7.1/onig.test"
sha256 = "af6f33f8903efae6d15d97ca94017cb439a7fdda51506618bd85100b17a72444"

[[suite]]
id = "upstream-man.test"
path = "comparison/jq/vendor/jq-1.7.1/man.test"
sha256 = "1d0c31386e6d431807ba1e0a2127c8e30705732355eafe8b794a70d1619d4f88"

[[suite]]
id = "upstream-optional.test"
path = "comparison/jq/vendor/jq-1.7.1/optional.test"
sha256 = "994c3be50823da63c7908a6e1c000a2f63a521bcb639a6423cfb1359e180e465"

# Dimension C: JSONTestSuite (y_/n_/i_), the file the golden tests use.
[json_suite]
id = "json-test-suite"
path = "tests/data/json-test-suite-1ef36fa.json"
sha256 = "e938a45b6fe3fa7913207bc4de389f52f5641de1f6f50746b4260dbeb1291050"
