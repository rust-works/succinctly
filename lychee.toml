# The options of both lychee attempts in .github/workflows/links.yml (the first
# and the retry that follows it), so an exclude added here reaches both (#3620).
# Both run `lychee --config lychee.toml '**/*.md'`.
#
# lychee reads ./lychee.toml by default, so a bare `lychee '**/*.md'` from the
# repository root uses these too, including the one-day cache of successful
# links (`lychee --cache=false` skips it).

# `--verbose` was one -v, which lychee 0.24 calls "warn": the excluded and
# failing links, not every successful one ("info" prints all of them).
verbose = "warn"
# A link's `#fragment` has to name a heading that exists. Without this a heading renamed after it
# was linked passed CI, and ten such links had piled up (#5873). It reads the headings of a local
# `.md` and the anchors of a fetched page (`anchor-only`: lychee 0.24 also takes `full` for `#:~:text=`).
include_fragments = "anchor-only"
no_progress = true
cache = true
max_cache_age = "1d"
max_retries = 3
retry_wait_time = 2
accept = ["100..=399"]

# Regular expressions, matched against the path as the glob spells it (no
# leading `./`; `lychee .` spells one, which `^(\./)?` allows for). lychee's glob
# ignores .gitignore, so the generated output a local build or benchmark run
# leaves behind is listed by hand: cargo's `target/` at any depth (the top level,
# bench-compare/, fuzz/) and the top-level `data/` (bench corpora and results).
# Neither holds a tracked file, so CI never sees them; `tests/data/` is tracked
# and is checked.
exclude_path = ['(^|/)target/', '^(\./)?data/']

exclude = [
  '^https://crates\.io/crates/',
  '^https://docs\.rs/',
  '^https://www\.intel\.com/',
  '^https://dl\.acm\.org/',
  '^https://lib\.rs/',
  '^https://developer\.arm\.com/',
  '^https://www\.agner\.org/',
  '^https://github\.com/rust-works/succinctly/compare/v',
  '^https://www\.cs\.cmu\.edu/',
  '^https://doi\.org/',
  '^https://no-color\.org/',
  '^https://www\.reddit\.com/',
  '^https://vigna\.di\.unimi\.it/',
  # A PDF under drops.dagstuhl.de/storage/ answers slowly enough to time out
  # from the runner on every retry (#3616); the host's landing pages are still
  # checked. Drop this once the server recovers.
  '^https://drops\.dagstuhl\.de/storage/',
  # Microsoft Research's publication pages answer 504 from the runner on every
  # retry (the Data-Parallel Finite-State Machines link in
  # docs/architecture/prior-art.md still did when probed directly), failing
  # Check Links on PRs that touch no link. Drop this once the server recovers.
  '^https://www\.microsoft\.com/en-us/research/',
  # Bit Twiddling Hacks (docs/architecture/prior-art.md) times out from the runner on
  # every retry, failing Check Links on main and on every PR that touches no link
  # (#5130). Drop this once the server recovers.
  '^https://graphics\.stanford\.edu/',
  # "The YAML Document from Hell" (docs/compliance/yaml/1.2.md, twice) stopped accepting
  # connections ("Network unreachable" on every retry; `curl` from a laptop fails to connect
  # too), failing Check Links on PRs that touch no link. The Wayback Machine holds a snapshot
  # from 2026-04-12. Drop this once the site recovers.
  '^https://ruudvanasseldonk\.com/',
  # A link pinned to a commit SHA cannot rot, but GitHub's web tier serves those
  # HTML pages with 503/504s for hours at a time (#3594), and a `commit/` page
  # has no raw form to check instead.
  '^https://github\.com/[^/]+/[^/]+/commit/[0-9a-f]{7,40}([/?#.]|$)',
  # Two links in a released CHANGELOG.md entry to headings that were renamed afterwards. A release
  # note is history and CHANGELOG.md is not edited in a PR (changelog.d/README.md), so the dead
  # anchors are listed here and the files still resolve (#5873).
  'limitations\.md#jqs-own-utf-8-replacement-character-substitution-fixed-at-function-granularity-open-at-document-granularity$',
  'limitations\.md#a-bad-escape-in-a-streamed-scalar-still-degrades-silently-instead-of-raising$',
]

# A pinned `blob/` link is checked at raw.githubusercontent.com instead (still a
# 404 for a mistyped path, ref or repo).
remap = [
  '^https://github\.com/([^/]+)/([^/]+)/blob/([0-9a-f]{7,40}|v[0-9][^/]*)/ https://raw.githubusercontent.com/$1/$2/$3/',
]
