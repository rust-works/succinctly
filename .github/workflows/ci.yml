name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue leg (#310). `merge_group` is a distinct event from
  # `push`/`pull_request`: when a PR is queued, GitHub builds a throwaway
  # `gh-readonly-queue/main/*` ref (the PR replayed onto the latest `main`) and
  # expects the required contexts to report *there*. Without this trigger a
  # queued PR would hang on all six required checks until the queue's
  # `check_response_timeout_minutes` elapsed and then be dropped — so this must
  # be on `main` *before* the `merge_queue` rule is added to ruleset 11913990.
  # `checks_requested` is the only activity type today; pinning it keeps the
  # workflow specific if more are added later.
  merge_group:
    types: [checks_requested]

# Cancel a PR branch's in-progress run when it's pushed again (#3011); every
# merge-queue entry gets its own `gh-readonly-queue/main/pr-N-<sha>` ref, and a
# `main` push never shares a group with anything else, so neither is ever
# cancelled by this.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Path-split gate (#202). Docs/skills-only PRs skip the heavy 3-arch matrix and
  # coverage while still publishing every required status context, so they merge
  # in seconds without deadlocking branch protection. A single gate is the source
  # of truth for the split — no twin `ci-skip.yml` whose stub job names must be
  # hand-mirrored against this matrix (which would silently rot when the matrix or
  # protection set changes). Non-PR events (main pushes, merge-queue builds)
  # always take the full path — on a `merge_group` event the `paths-filter` step
  # self-skips and `decide` sets `code=true`, so whatever is about to become
  # `main` always gets the full required matrix (#310). No markdown is
  # `include_str!`-compiled here, but the doc set still scopes `*.md` to the repo
  # root only — never `**/*.md` — so anything not explicitly a doc runs full CI
  # (fail-safe).
  gate:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.claude/skills/**'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  # Required-context jobs (Test x86/ARM/macOS, Clippy, Format, Documentation)
  # always run so their contexts always report `success`; on the fast path every
  # step is skipped, which is a genuine passing job — not a `skipped` conclusion
  # whose branch-protection semantics vary. Non-required jobs (bench, coverage,
  # perf-guard) below skip wholesale via a job-level `if`.
  # #3059: the feature-flag `cargo test` invocations below are mutually
  # independent (no step consumes a prior step's output) and were previously
  # chained sequentially in one job, inflating this leg's wall-clock ~2x
  # versus running them in parallel. Split into matrix legs
  # (test-x86-matrix) that fan out across runners; this job stays a thin
  # required-context aggregator, since `Test (x86_64)` is in the branch
  # ruleset's required-status-checks list and a matrix job's per-leg context
  # names (`Test (x86_64) (cli-gated)`, etc.) can never satisfy that exact
  # literal name on their own. #3064 later merged two of the resulting
  # sub-minute legs back together (see bench-runner-and-sse2-dispatch below)
  # after this fan-out doubled job count against the org's free-plan
  # runner-slot ceiling with no net wall-clock win under real merge-queue
  # contention.
  test-x86:
    name: Test (x86_64)
    needs: test-x86-matrix
    # `if: always()` + an explicit result check, not the bare `needs:` this replaced:
    # GitHub skips (not fails) a job whose `needs:` target failed, and a `skipped`
    # conclusion's branch-protection semantics vary -- so a broken leg wasn't
    # reliably blocking merge (#3084). `needs.test-x86-matrix.result` is `success`
    # only when every matrix leg succeeded.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test-x86-matrix.result }}" = "success" \
            || { echo "::error::a Test (x86_64) matrix leg did not succeed (${{ needs.test-x86-matrix.result }})"; exit 1; }

  test-x86-matrix:
    name: Test (x86_64) (${{ matrix.name }})
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-gated
            buildCli: true
            testCmd: cargo test --features cli --test yq_cli_tests --test yq_golden_tests --test yq_path_consistency_tests --test jq_golden_tests --test yaml_bench_suite_coverage --test dsv_cli_tests --test text_cli_tests --test json_validate_tests --test yaml_validate_tests --test cli_golden_tests --test cli_characterization_tests --test deep_nesting_valid_tests --test jq_cli_tests
          # `tests/orchestrate_cli_tests.rs` is `#![cfg(feature = "bench-runner")]`
          # and must stay isolated from the cli-gated leg above (#1705): its
          # `cargo run`-spawned CLI subprocesses would otherwise re-link the
          # shared `target/debug/succinctly` binary with a narrower feature
          # set, dropping the `bench` subcommand out from under this test
          # target if it ran in the same invocation.
          #
          # #3064: combined with the former standalone `sse2-clamped-dispatch`
          # leg below (each individually sub-minute -- ~18-36s and
          # ~36s-2min -- so giving each its own dedicated runner nearly
          # doubled this matrix's job count for no real wall-clock win once
          # measured against actual merge-queue runner-slot contention; see
          # the issue for the account-level evidence). Neither invocation
          # depends on the other or shares mutable state, so chaining them in
          # one leg is safe -- this doesn't touch the succinctly CLI binary
          # `cargo run`-spawns, so it can't hit the #1705 re-link hazard the
          # comment above guards against.
          #
          # The second command re-runs the suite with yaml x86 dispatch
          # clamped to SSE2 (#247): the parser and the light.rs regression
          # tests then genuinely execute the 16-byte classify path, so a
          # reintroduced length-derived skip width (#231) fails here instead
          # of sailing through on AVX2 dispatch. The in-lib contract test
          # (test_succinctly_simd_env_contract) fails this leg if the clamp
          # ever stops applying or the value here is typo'd.
          - name: bench-runner-and-sse2-dispatch
            buildCli: true
            testCmd: |
              cargo test --features cli,bench-runner --test orchestrate_cli_tests
              SUCCINCTLY_SIMD=sse2 cargo test --verbose
          - name: default
            buildCli: false
            testCmd: cargo test --verbose
          - name: simd
            buildCli: false
            testCmd: cargo test --verbose --features simd
          - name: portable-popcount
            buildCli: false
            testCmd: cargo test --verbose --features portable-popcount
          # scalar-yaml switches x86_64 off the `x86` module entirely, so it is
          # a distinct dispatch set that no other leg here builds (#185). Its
          # ARM counterpart, plus broadword-yaml, run on the test-arm-matrix
          # job — broadword-yaml is a no-op on x86_64.
          - name: scalar-yaml
            buildCli: false
            testCmd: cargo test --verbose --features simd,scalar-yaml
          # #2114: `cargo check` doesn't build test targets at all, so it never
          # caught #2083 (a std-only symbol reachable from test code with no
          # matching cfg gate) -- `cargo test` both builds and runs them.
          - name: no-std
            buildCli: false
            testCmd: cargo test --no-default-features --verbose
    env:
      # x86 SIMD CI leg (#193): the SIMD suites self-skip (with a visible
      # `SKIPPED` line) when a CPU feature is missing, so this pins the runner
      # contract — tests/simd_expectation_tests.rs fails the leg if any listed
      # feature stops being detected, instead of the suites silently skipping.
      # Coverage is two-layered on this AVX2 runner:
      #  - Kernel correctness: the differential tests (tests/simd_level_tests.rs,
      #    tests/dsv_simd_differential_tests.rs, src/yaml/simd/x86.rs) call each
      #    kernel directly, so every kernel level is exercised regardless of
      #    dispatch.
      #  - Caller integration: kernel-direct tests cannot catch caller-side
      #    bugs like the classify/skip-width accounting (#231), so the
      #    "sse2-clamped-dispatch" leg re-runs the suite with
      #    SUCCINCTLY_SIMD=sse2 (docs/reference/environment-variables.md),
      #    forcing the yaml parser through the real 16-byte SSE2 dispatch
      #    path (#247). The clamp affects dispatch only, not detection, so
      #    this expectation still holds in that leg.
      SUCCINCTLY_EXPECT_SIMD: sse2,sse4.2,avx2,bmi2,popcnt
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Check CPU features (x86 SIMD)
        if: needs.gate.outputs.code == 'true'
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "Model name|Architecture|CPU" || true
          echo "=== x86 SIMD Detection (expecting $SUCCINCTLY_EXPECT_SIMD) ==="
          for feature in sse2 sse4_2 avx2 bmi2 popcnt; do
            if grep -qw "$feature" /proc/cpuinfo; then echo "$feature: supported"; else echo "$feature: not detected"; fi
          done

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: needs.gate.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      # The x86 SIMD tests (BMI2, AVX2) self-skip when the feature is absent,
      # which reads as a silent pass. Fail loudly if this runner can't actually
      # exercise them, so an all-skipped SIMD suite never looks green (#192).
      # NOTE: AVX-512 is intentionally NOT required — the standard x86 runners
      # (Zen 3 EPYC) lack it, so those paths are validated off routine CI. See
      # CONTRIBUTING.md ("SIMD CI coverage").
      - name: Verify SIMD CPU features (BMI2 + AVX2)
        if: needs.gate.outputs.code == 'true'
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "Model name|Architecture|Flags" || true
          missing=""
          grep -qw avx2 /proc/cpuinfo || missing="$missing avx2"
          grep -qw bmi2 /proc/cpuinfo || missing="$missing bmi2"
          if [ -n "$missing" ]; then
            echo "::error::x86 runner is missing CPU feature(s):$missing — the BMI2/AVX2 SIMD tests would self-skip. See CONTRIBUTING.md (SIMD CI coverage)."
            exit 1
          fi
          echo "BMI2 + AVX2 present: SIMD tests will assert, not skip."

      - name: Build CLI (for integration tests)
        if: needs.gate.outputs.code == 'true' && matrix.buildCli
        run: cargo build --features cli --bin succinctly

      - name: Run tests
        if: needs.gate.outputs.code == 'true'
        run: ${{ matrix.testCmd }}

  # #3059: same rationale as test-x86/test-x86-matrix above — the feature-flag
  # `cargo test` invocations and Clippy variants below are mutually
  # independent and were previously chained sequentially in one job.
  # `Test (ARM64)` is a required status check, so this job stays a thin
  # aggregator over test-arm-matrix's per-leg contexts. #3064 later merged
  # the 3 Clippy variants into the single clippy-all-variants leg below (and,
  # symmetrically, test-x86-matrix's two sub-minute legs into one) without
  # giving up the isolation of the genuinely long cli-gated leg -- see #3064
  # on test-x86 above for the account-level contention evidence driving that
  # follow-up.
  test-arm:
    name: Test (ARM64)
    needs: test-arm-matrix
    # See test-x86 above for why this is `if: always()` + a result check rather
    # than a bare `needs:` (#3084).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test-arm-matrix.result }}" = "success" \
            || { echo "::error::a Test (ARM64) matrix leg did not succeed (${{ needs.test-arm-matrix.result }})"; exit 1; }

  test-arm-matrix:
    name: Test (ARM64) (${{ matrix.name }})
    needs: gate
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-gated
            buildCli: true
            testCmd: cargo test --features cli --test yq_cli_tests --test yq_golden_tests --test yq_path_consistency_tests --test jq_golden_tests --test yaml_bench_suite_coverage --test dsv_cli_tests --test text_cli_tests --test json_validate_tests --test yaml_validate_tests --test cli_golden_tests --test cli_characterization_tests --test deep_nesting_valid_tests --test jq_cli_tests
          - name: bench-runner-gated
            buildCli: true
            testCmd: cargo test --features cli,bench-runner --test orchestrate_cli_tests
          - name: default
            buildCli: false
            testCmd: cargo test --verbose
          - name: simd
            buildCli: false
            testCmd: cargo test --verbose --features simd
          # SUCCINCTLY_SVE2=1 switches JSON semi-index building to the SVE2
          # kernels (src/json/simd/mod.rs use_sve2()); DSV and broadword SVE2
          # are always-on via sve2-bitperm detection and covered by the
          # `simd` leg above. Without this leg the JSON SVE2 dispatch has no
          # routine CI coverage (#194). Neoverse-N2 provides sve2, so
          # use_sve2() is true here.
          - name: simd-sve2-dispatch
            buildCli: false
            testCmd: SUCCINCTLY_SVE2=1 cargo test --verbose --features simd
          - name: portable-popcount
            buildCli: false
            testCmd: cargo test --verbose --features portable-popcount
          # The YAML backend selectors are mutually exclusive by cfg, so a
          # build compiles at most one of neon/broadword/x86 and the compiler
          # never compares them. Nothing built these two flags until #185,
          # which is how `neon.rs` came to carry a drifted duplicate of the
          # whole broadword layer for however long: both copies were
          # syntactically fine, and no leg ever instantiated the one that had
          # gone stale. This leg exists to make the unselected backend fail
          # loudly rather than rot quietly.
          - name: broadword-yaml
            buildCli: false
            testCmd: cargo test --verbose --features simd,broadword-yaml
          - name: scalar-yaml
            buildCli: false
            testCmd: cargo test --verbose --features simd,scalar-yaml
          # Same no_std cargo-test rationale as test-x86 (#2114) -- this leg
          # needs its own copy rather than relying on that one, because it's
          # the only place the target_arch="aarch64"-gated NEON/SVE2 test
          # modules (src/util/simd/neon.rs, sve2.rs; src/yaml/simd/neon.rs;
          # src/dsv/simd/neon.rs, sve2.rs; src/json/simd/neon.rs, sve2.rs)
          # ever get built at all -- an x86_64 runner can't compile them
          # regardless of cargo subcommand or feature flags, so a
          # #2083-class std-only-symbol bug inside any of them was invisible
          # to every CI leg until this one (#2123).
          - name: no-std
            buildCli: false
            testCmd: cargo test --no-default-features --verbose
          # No clippy job runs on aarch64, so every target_arch="aarch64"-gated
          # kernel — yaml/simd/neon.rs, yaml/simd/broadword.rs, the NEON
          # popcount path in src/bits/popcount.rs, plus the DSV/JSON/util
          # NEON+SVE2 kernels — has only ever been built and tested here,
          # never linted (#388, the ARM half of the same blind spot fixed for
          # x86_64 in the `clippy` job). Three separate `cargo clippy`
          # invocations are needed because the YAML backend selectors are
          # cfg-exclusive (see the `broadword-yaml` leg above): one build
          # only ever selects one of neon/broadword/scalar.
          #
          # #3064: chained into a single leg rather than three dedicated
          # matrix legs -- each individual invocation is well under a minute,
          # so splitting them across three runners nearly doubled this
          # matrix's job count for no real wall-clock win once measured
          # against actual merge-queue runner-slot contention (see the issue
          # for the account-level evidence). The three `cargo clippy`
          # invocations don't share mutable state beyond the target/ build
          # cache, so chaining them is safe.
          - name: clippy-all-variants
            clippy: true
            testCmd: |
              cargo clippy --all-targets --all-features -- -D warnings
              cargo clippy --all-targets --features std,simd,serde,cli,regex,bench-runner,large-tests,mmap-tests -- -D warnings
              cargo clippy --all-targets --features std,simd,broadword-yaml,serde,cli,regex,bench-runner,large-tests,mmap-tests -- -D warnings
    env:
      # ARM SIMD CI leg (#194, mirroring the x86 pattern from #193): the SVE2
      # suites self-skip (with a visible `SKIPPED` line) when a CPU feature is
      # missing, so this pins the runner contract —
      # tests/simd_expectation_tests.rs fails the leg if any listed feature
      # stops being detected, instead of the suites silently skipping.
      SUCCINCTLY_EXPECT_SIMD: neon,sve2,sve2-bitperm
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        if: needs.gate.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      # The aarch64 SVE2 tests self-skip (emitting a `SKIPPED: SIMD test` marker
      # via note_simd_skip) when sve2-bitperm is absent. The ubuntu-24.04-arm
      # runner (Neoverse-N2) provides it, so require it here: an all-skipped SVE2
      # suite must never read as green (#192). NEON is always present on
      # aarch64. Not meaningful for the Clippy legs (they only compile, never
      # execute SIMD), so skipped there.
      - name: Verify SIMD CPU features (NEON + SVE2-BITPERM)
        if: needs.gate.outputs.code == 'true' && !matrix.clippy
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "Model name|Architecture|CPU|Flags" || true
          if ! grep -qw svebitperm /proc/cpuinfo; then
            echo "::error::ARM runner lacks SVE2-BITPERM — the SVE2 BDEP/BEXT tests would self-skip. See CONTRIBUTING.md (SIMD CI coverage)."
            exit 1
          fi
          echo "NEON (always on aarch64) + SVE2-BITPERM present: SIMD tests will assert, not skip."

      - name: Build CLI (for integration tests)
        if: needs.gate.outputs.code == 'true' && matrix.buildCli
        run: cargo build --features cli --bin succinctly

      - name: Run
        if: needs.gate.outputs.code == 'true'
        run: ${{ matrix.testCmd }}

  # #3064: converts the previously-sequential 6-step chain below (15m45s in
  # the run that exposed #3059's contention problem -- the single longest
  # *real* job in that run, and entirely untouched by #3059 since only
  # test-x86/test-arm were split) into matrix legs, same required-context
  # aggregator pattern as test-x86/test-arm above. Unlike those two, this
  # starts pre-rebalanced at 2 legs rather than fanning out to one leg per
  # step: #3064 found that maximal fan-out roughly doubled test-x86/test-arm's
  # job count against this org's free-plan runner-slot ceiling, for zero net
  # wall-clock win once measured under real merge-queue concurrency (a
  # trivial gatekeeper job saw a 6m46s pure queue wait -- longer than the
  # entire per-leg speedup the split was meant to deliver). Only the
  # genuinely long cli-gated step is isolated onto its own runner; every
  # other step stays chained in one combined leg, matching the rebalance
  # applied to test-x86-matrix's bench-runner-and-sse2-dispatch leg and
  # test-arm-matrix's clippy-all-variants leg below.
  test-macos-arm:
    name: Test (macOS ARM64)
    needs: test-macos-arm-matrix
    # See test-x86 above for why this is `if: always()` + a result check rather
    # than a bare `needs:` (#3084).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test-macos-arm-matrix.result }}" = "success" \
            || { echo "::error::a Test (macOS ARM64) matrix leg did not succeed (${{ needs.test-macos-arm-matrix.result }})"; exit 1; }

  test-macos-arm-matrix:
    name: Test (macOS ARM64) (${{ matrix.name }})
    needs: gate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-gated
            buildCli: true
            testCmd: cargo test --features cli --test yq_cli_tests --test yq_golden_tests --test yq_path_consistency_tests --test jq_golden_tests --test yaml_bench_suite_coverage --test dsv_cli_tests --test text_cli_tests --test json_validate_tests --test yaml_validate_tests --test cli_golden_tests --test cli_characterization_tests --test deep_nesting_valid_tests --test jq_cli_tests
          # `tests/orchestrate_cli_tests.rs` is `#![cfg(feature = "bench-runner")]`
          # and must stay isolated from the cli-gated leg above (#1705): its
          # `cargo run`-spawned CLI subprocesses would otherwise re-link the
          # shared `target/debug/succinctly` binary with a narrower feature
          # set, dropping the `bench` subcommand out from under this test
          # target if it ran in the same invocation. The remaining four
          # `cargo test` invocations don't share that hazard (none of them
          # spawn the CLI binary), so they're chained after it in the same
          # leg rather than each getting a dedicated runner -- see #3064.
          #
          # Same no_std cargo-test rationale as test-x86 (#2114) applies to
          # the last line -- macOS ARM64 is the only leg that builds the
          # target_arch="aarch64"-gated NEON test modules under Apple's own
          # toolchain rather than Linux's; a #2083-class std-only-symbol bug
          # reachable only there was invisible to every CI leg until this
          # one (#2123).
          - name: rest
            buildCli: true
            testCmd: |
              cargo test --features cli,bench-runner --test orchestrate_cli_tests
              cargo test --verbose
              cargo test --verbose --features simd
              cargo test --verbose --features portable-popcount
              cargo test --no-default-features --verbose
    env:
      # Apple Silicon has NEON but no SVE/SVE2, so only NEON is pinned; the
      # SVE2 suites are *expected* to print `SKIPPED` lines on this leg. SVE2
      # coverage comes from the ARM64 Linux leg above (and locally via
      # scripts/test-sve2-qemu.sh, #194).
      SUCCINCTLY_EXPECT_SIMD: neon
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: needs.gate.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI (for integration tests)
        if: needs.gate.outputs.code == 'true' && matrix.buildCli
        run: cargo build --features cli --bin succinctly

      - name: Run
        if: needs.gate.outputs.code == 'true'
        run: ${{ matrix.testCmd }}

  # Upstream-toolchain leg (#203). Runs the x86_64 test suite on beta and nightly
  # to catch upcoming-compiler breakage (lint changes, soundness fixes, stdlib
  # deprecations) before it reaches a release. x86_64 only — the 3-arch fan-out
  # above stays on `stable` so we don't triple CI minutes. `beta` gates CI;
  # `nightly` is advisory (`continue-on-error`) because it is the flakiest. Not a
  # required status context, so it skips wholesale on the docs-only fast path
  # (job-level `if`, like bench/coverage/perf-guard) rather than run-and-skip-steps. Also
  # skipped on `merge_group` (#310): it is advisory, not required, so running it
  # per queue entry would just add latency to every merge without gating it.
  # #3059: same rationale as test-x86-matrix above, applied to the second
  # matrix dimension — the 6 feature-flag `cargo test` invocations per
  # toolchain leg are mutually independent and were previously chained
  # sequentially. Unlike test-x86/test-arm, this job isn't a required status
  # check, so no thin aggregator is needed: the per-combination context names
  # are free to vary.
  test-x86-upstream:
    name: Test (x86_64) (${{ matrix.rust }}, ${{ matrix.variant.name }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                                   # beta breakage must not cancel nightly
      matrix:
        rust: [beta, nightly]
        variant:
          - name: cli-gated
            buildCli: true
            testCmd: cargo test --features cli --test yq_cli_tests --test yq_golden_tests --test yq_path_consistency_tests --test yaml_bench_suite_coverage --test dsv_cli_tests --test text_cli_tests --test json_validate_tests --test yaml_validate_tests --test cli_golden_tests --test cli_characterization_tests --test deep_nesting_valid_tests --test jq_cli_tests
          - name: bench-runner-gated
            buildCli: true
            testCmd: cargo test --features cli,bench-runner --test orchestrate_cli_tests
          - name: default
            buildCli: false
            testCmd: cargo test --verbose
          - name: simd
            buildCli: false
            testCmd: cargo test --verbose --features simd
          - name: portable-popcount
            buildCli: false
            testCmd: cargo test --verbose --features portable-popcount
          # Same no_std cargo-test rationale as test-x86 (#2114).
          - name: no-std
            buildCli: false
            testCmd: cargo test --no-default-features --verbose
    continue-on-error: ${{ matrix.rust == 'nightly' }}   # beta gates CI; nightly is advisory
    env:
      # Same x86 SIMD runner contract as test-x86 (#193).
      SUCCINCTLY_EXPECT_SIMD: sse2,sse4.2,avx2,bmi2,popcnt
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.variant.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI (for integration tests)
        if: matrix.variant.buildCli
        run: cargo build --features cli --bin succinctly

      - name: Run tests
        run: ${{ matrix.variant.testCmd }}

  # Skipped on `merge_group` (#310): a 3-arch `cargo bench` fan-out is far too
  # slow to run per queue entry, and it gates nothing.
  #
  # #3059: the 3 `cargo bench` invocations per arch used to run back-to-back
  # in one job; matrixed over both arch and feature variant here so they run
  # in parallel instead.
  bench:
    name: Bench (${{ matrix.platform.name }}, ${{ matrix.variant.name }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            runner: ubuntu-latest
            arch: x86_64
          - name: ARM64-Linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - name: ARM64-macOS
            runner: macos-latest
            arch: arm64-macos
        variant:
          - name: default
            args: ''
          - name: simd
            args: '--features simd'
          - name: portable
            args: '--features portable-popcount'
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.platform.arch }}-bench-${{ matrix.variant.name }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Print CPU info
        run: |
          echo "=== CPU Info ==="
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            lscpu | grep -E "Model name|Architecture|CPU\(s\)|Flags" || true
            # Check for specific features
            echo "=== Feature Detection ==="
            if grep -q avx2 /proc/cpuinfo 2>/dev/null; then echo "AVX2: supported"; else echo "AVX2: not detected"; fi
            if grep -q popcnt /proc/cpuinfo 2>/dev/null; then echo "POPCNT: supported"; else echo "POPCNT: not detected"; fi
            if grep -q sve2 /proc/cpuinfo 2>/dev/null; then echo "SVE2: supported"; else echo "SVE2: not detected"; fi
            if grep -q svebitperm /proc/cpuinfo 2>/dev/null; then echo "SVE2-BITPERM: supported"; else echo "SVE2-BITPERM: not detected"; fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            sysctl -n machdep.cpu.brand_string || true
            system_profiler SPHardwareDataType | grep -E "Chip|Cores" || true
            echo "Note: Apple Silicon does not support SVE/SVE2"
          fi

      - name: Run benchmarks
        run: cargo bench --bench rank_select ${{ matrix.variant.args }} -- --noplot | tee bench-${{ matrix.variant.name }}.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.platform.arch }}-${{ matrix.variant.name }}
          path: bench-${{ matrix.variant.name }}.txt

  # Instruction-count regression guard (#1523): `bench` above times
  # `rank_select` and uploads artifacts nobody compares against a baseline --
  # #1385's 2-3x jq slowdown shipped through it unnoticed. Wall-clock timing
  # on a shared runner is the wrong mechanism (too noisy for a threshold
  # tight enough to matter); `valgrind --tool=cachegrind` counts instructions
  # instead, which is deterministic regardless of runner noise. Not run on
  # macOS: valgrind has no Apple Silicon support at all. Not run in the merge
  # queue for the same reason `bench` isn't (see its own `if`, above).
  #
  # On `pull_request` runs this also builds a binary from the PR's own
  # `git merge-base` and checks against *that* instead of the committed
  # baseline file (#1582): at this project's merge cadence the file drifts
  # 1-3% within days from ordinary accumulated changes alone, consuming most
  # of the 5% threshold before any single PR is measured. A same-run
  # comparison against the PR's own merge-base cancels that staleness (and
  # any codegen/toolchain drift) instead of trying to keep the file fresh.
  # `push` runs (direct pushes to `main`) have no PR/merge-base and fall back
  # to the file, same as before.
  perf-guard:
    name: Perf Regression Guard (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
          - name: ARM64-Linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history for git merge-base (PR fork point) -- #1582

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.name }}-perf-guard-${{ hashFiles('**/Cargo.lock') }}

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # Merge-base commit always builds cleanly -- it's an ancestor of `main`
      # that already passed this same required CI when it landed. Built into
      # a separate worktree/target dir so it can't collide with (or poison
      # the cache of) the PR-head build below.
      #
      # Review (#2117): this step's own `worktree add`/`cd`/`cargo build`
      # sequence is duplicated (with a different SHA source and dest path)
      # by the "Build previous-commit binary" step just below -- if you're
      # changing the build invocation here (a feature flag, the worktree
      # convention, ...), check whether that step needs the identical change
      # too, so the two baselines stay built consistently.
      - name: Build merge-base binary
        if: github.event_name == 'pull_request'
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main)
          echo "Building merge-base binary at $MERGE_BASE for PR-relative perf comparison (#1582)"
          git worktree add --detach /tmp/perf-guard-merge-base "$MERGE_BASE"
          cd /tmp/perf-guard-merge-base
          cargo build --release --features cli

      # #2117: the `push` path's own same-run baseline, mirroring #1582's
      # `pull_request` treatment above -- compares against the single commit
      # this push landed on top of (`github.event.before`, the SHA `main`
      # pointed to immediately before this push), cancelling the same
      # ordinary `Ir` drift #1582 already cancels for `pull_request` runs.
      # Without this, every `push` (i.e. every commit the merge queue lands
      # on `main`) fell back to the checked-in
      # `tests/data/perf-guard-baseline.json` file, which drifts 1-3% across
      # every query within days at this project's merge cadence (#2059) --
      # a real staleness incident this closes off at the source rather than
      # requiring a periodic manual `--update-baseline` refresh.
      #
      # Falls back to that same checked-in file (leaving `PERF_GUARD_PREV_BUILT`
      # unset, so the run step below leaves `EXTRA_ARGS` empty) when `before`
      # isn't a real, buildable commit -- the all-zeros SHA on a branch's
      # first push, or a SHA this `fetch-depth: 0` checkout doesn't actually
      # have (a force-push/history-rewrite edge case) -- rather than
      # assuming it always is.
      #
      # Same `worktree add`/`cd`/`cargo build` sequence as "Build merge-base
      # binary" above (see its own comment) -- keep the two in sync.
      - name: Build previous-commit binary
        if: github.event_name == 'push'
        env:
          # Not attacker-influenced (GitHub computes this itself, always a
          # 40-hex-char SHA or the all-zero SHA) -- routed through `env:`
          # rather than spliced into the script via `${{ }}` anyway, so this
          # step isn't a template a future *do* attacker-influenced field
          # (a branch/tag name, say) could get copy-pasted into unsafely.
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Building previous-commit binary at $BEFORE for push-relative perf comparison (#2117)"
            git worktree add --detach /tmp/perf-guard-prev-commit "$BEFORE"
            cd /tmp/perf-guard-prev-commit
            cargo build --release --features cli
            echo "PERF_GUARD_PREV_BUILT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::github.event.before ($BEFORE) is not a valid buildable commit -- falling back to the checked-in baseline file for this push"
          fi

      - name: Build release binary
        run: cargo build --release --features cli

      - name: Run perf guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA_ARGS="--baseline-binary /tmp/perf-guard-merge-base/target/release/succinctly"
          elif [ "${{ github.event_name }}" = "push" ] && [ "$PERF_GUARD_PREV_BUILT" = "1" ]; then
            EXTRA_ARGS="--baseline-binary /tmp/perf-guard-prev-commit/target/release/succinctly"
          else
            EXTRA_ARGS=""
          fi
          python3 scripts/perf-guard.py --binary target/release/succinctly --arch "${{ matrix.name }}" --check $EXTRA_ARGS

  clippy:
    name: Clippy
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        if: needs.gate.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `--all-features` turns on `scalar-yaml`, whose cfgs compile out *every*
      # YAML SIMD backend — so the step above has never linted `yaml/simd/x86.rs`,
      # `neon.rs` or `broadword.rs` (verified: a lint planted in x86.rs does not
      # fire under `--all-features`, and does with the set below). That is the same
      # blind spot that let the duplicated broadword layer drift, one level up
      # (#185). This runner is x86_64, so it covers the x86 backend; the ARM
      # backends are linted by the test-arm leg below.
      #
      # `portable-popcount` is dropped (unlike the x86 backend step's earlier form):
      # `simd` + `portable-popcount` together also un-gate the AVX-512 popcount path
      # (src/bits/popcount.rs) the same way `scalar-yaml` un-gates the YAML backends,
      # so this step now covers both blind spots at once (#388).
      # `popcount_words_portable`, gated *by* `portable-popcount`, stays covered by
      # the `--all-features` step above.
      - name: Run Clippy (YAML SIMD + AVX-512 popcount backend selected)
        if: needs.gate.outputs.code == 'true'
        run: cargo clippy --all-targets --features std,simd,serde,cli,regex,bench-runner,large-tests,mmap-tests -- -D warnings

  fmt:
    name: Format
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        if: needs.gate.outputs.code == 'true'
        run: cargo fmt --all -- --check

  skill-casing:
    name: Skill manifest casing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SKILL.md casing (#189)
        run: |
          bad="$(find .claude/skills -maxdepth 2 -iname 'skill.md' ! -name 'SKILL.md')"
          if [ -n "$bad" ]; then
            echo "::error::Skill manifests must be named SKILL.md (see #189):"
            echo "$bad"
            exit 1
          fi

  docs:
    name: Documentation
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install Rust
        if: needs.gate.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        if: needs.gate.outputs.code == 'true'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Skipped on `merge_group` (#310): this posts a sticky *PR* comment and needs
  # `pull-requests: write`, but a merge-group build has no associated PR
  # (`github.event.pull_request` is absent), so it could only error or no-op.
  # Patch coverage is reported on the PR before it is ever queued.
  coverage:
    name: Coverage (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            use-prebuilt: 'true'
          - name: ARM64
            runner: ubuntu-24.04-arm
            use-prebuilt: 'false'   # no aarch64-linux prebuilt; build omni-dev from source
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      pull-requests: write          # required to post the sticky coverage comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history for git merge-base (PR fork point)

      - uses: action-works/omni-dev-coverage-check@v1
        with:
          # Pin; we're a consumer. Must stay >= 0.38.0: that release added the
          # declarative `.omni-dev/coverage.yaml` ignore-list (omni-dev#1398),
          # which is how the CPU-conditional `src/bits/popcount.rs` flap (#302)
          # is silenced. The action does not thread `--ignore-filename-regex`,
          # so config-file discovery from the checkout is the only route.
          # Bumped to 0.42.0 for #1554: that release carries omni-dev#1580's
          # fix (PR rust-works/omni-dev#1586, switching `coverage diff`'s
          # internal git diff to libgit2's patience algorithm), which resolves
          # the patch-coverage misattribution this repo hit on refactor-shaped
          # diffs with long runs of near-duplicate lines (src/jq/eval.rs on
          # PR #1551) -- verified locally against that PR's exact base/head
          # commits with the 0.42.0 binary: patch coverage now reports 7/7
          # new lines for eval.rs, not the pre-fix "5161/6070 new lines"
          # spanning nearly the whole file.
          # Bumped to 0.43.0 for #2467: that release adds source-comment
          # coverage markers (rust-works/omni-dev#1593) -- `tolerate`/`ignore`
          # regions delimited by `// omni-dev: coverage tolerate reason="..."`
          # ... `// omni-dev: coverage end`, scanned from each revision's own
          # source. On an older binary a marker comment is inert and nothing
          # is silenced, so this pin must stay >= 0.43.0. This is what lets
          # `src/util/simd/x86.rs` mask its CPU-gated `detect_fast_bmi2` flap
          # (10 lines, net 9 covered, #2449) via an in-source marker instead
          # of a file-level exclusion.
          version: 0.43.0
          use-prebuilt-binary: ${{ matrix.use-prebuilt }}
          test-args: --features cli,simd,regex,serde --workspace
          fail-under-lines: 55   # floor a few pts below local llvm-cov (ARM: 59.58% lines)
          # fail-under-patch left unset → report-only initially
          baseline-artifact-name: coverage-baseline-${{ matrix.name }}
          artifact-name: coverage-summary-${{ matrix.name }}
          comment-header: coverage-${{ matrix.name }}

  # Drift detector for the yq golden fixtures (tests/data/yq-golden/): the
  # goldens are frozen oracle output, so this is the one job that re-checks
  # them against the pinned mikefarah/yq. Unlike the pre-#227 comparison
  # tests, a missing or wrong-version yq fails the check — it cannot silently
  # self-skip when it runs. The gate is applied per-STEP (not as a job-level
  # `if`) so that on the docs-only fast path every step skips but the job still
  # reports a genuine `success` rather than a `skipped` conclusion whose
  # branch-protection semantics vary — matching the required Test/Clippy/Format
  # jobs above, so this context is safe to mark required.
  yq-drift:
    name: yq golden drift check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install pinned yq
        if: needs.gate.outputs.code == 'true'
        run: |
          V="$(cat tests/data/yq-golden/YQ_VERSION)"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${V}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version | grep -F "version ${V}"

      - name: Verify goldens against pinned yq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-yq-golden.sh --check

  # Drift detector for the jq golden fixtures (tests/data/jq-golden/): the
  # goldens are frozen oracle output, so this is the one job that re-checks
  # them against the pinned jqlang/jq. A missing or wrong-version jq fails the
  # check — it cannot silently self-skip when it runs. Per-STEP gate for the
  # same required-context-safe reason as yq-drift above (#300 mirrors #227).
  jq-drift:
    name: jq golden drift check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install pinned jq
        if: needs.gate.outputs.code == 'true'
        run: |
          V="$(cat tests/data/jq-golden/JQ_VERSION)"
          curl -fsSL "https://github.com/jqlang/jq/releases/download/${V}/jq-linux-amd64" \
            -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
          jq --version | grep -F "${V}"

      - name: Verify goldens against pinned jq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-jq-golden.sh --check

      # Same idea for the error-message table (#356): the captured wording in
      # tests/data/jq-error-messages.tsv is oracle output too, and
      # tests/jq_error_message_tests.rs asserts both evaluators reproduce it.
      - name: Verify error messages against pinned jq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-jq-error-messages.sh --check

  # Drift detector for the real-workload corpus shape statistics (#301). Runs
  # entirely offline over the committed seed (tests/data/bench-corpus/seed/): it
  # (1) verifies each vendored seed file's sha256 against the manifest, then
  # (2) regenerates the shape report and diffs it against the committed golden
  # (tests/data/bench-corpus/expected-shape.md). The golden is all-integer
  # (structural counts derived from the semi-index), so it is arch-stable and a
  # single x86 leg is authoritative. This guards the tooling and the
  # representativeness lookup from silently rotting as the parsers change.
  # Per-STEP gate for the same required-context-safe reason as jq/yq-drift.
  corpus-shape-drift:
    name: corpus shape drift check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Verify vendored seed corpus against the manifest
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-bench-corpus.sh --check

      - name: Verify shape golden matches the seed corpus
        if: needs.gate.outputs.code == 'true'
        run: |
          cargo run --features cli --bin succinctly -- \
            dev bench corpus-stats \
            --data-dir tests/data/bench-corpus/seed \
            --markdown tests/data/bench-corpus/expected-shape.md \
            --check

  # Drift detector for the vendored JSONTestSuite corpus
  # (tests/data/json-test-suite-<sha>.json). The corpus is vendored so that
  # `cargo test` needs no network; this job is the one place that re-fetches
  # nst/JSONTestSuite at the pinned SHA and confirms the in-tree copy still
  # matches, so the conformance suite cannot silently drift from upstream.
  # Per-STEP gate for the same required-context-safe reason as jq/yq-drift.
  json-suite-drift:
    name: JSONTestSuite corpus drift check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Verify vendored corpus against pinned upstream
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-json-test-suite.sh --check

  # Drift detector for docs/benchmarks/corpus-shape.md, the representativeness
  # lookup that gates every perf proposal (ADR-0007, ADR-0012).
  #
  # Deliberately separate from corpus-shape-drift: that job is offline and
  # covers the committed *seed*, which is 7 of the corpus's 8 YAML files and 1
  # of its 5 JSON files. corpus-shape.md describes the *full* corpus, so the
  # fetched tier is exactly the region the offline job cannot observe -- and it
  # did drift there undetected (the #485 YAML fix shifted node counts in
  # prometheus-ci.yml, the one YAML file the seed lacks, while the seed golden
  # stayed green). Keeping the two jobs apart preserves the offline job's
  # guarantee and isolates a fetch failure to the networked half.
  # Per-STEP gate for the same required-context-safe reason as jq/yq-drift.
  corpus-shape-full-drift:
    name: corpus shape drift check (full corpus)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Fetch the full real-workload corpus
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-bench-corpus.sh

      - name: Verify shape report matches the full corpus
        if: needs.gate.outputs.code == 'true'
        run: |
          cargo run --features cli --bin succinctly -- \
            dev bench corpus-stats \
            --data-dir data/bench/corpus \
            --markdown docs/benchmarks/corpus-shape.md \
            --check

  # Compile-check the fuzzing harness (fuzz/), a separate workspace on its own
  # lockfile. Running the fuzzer on the PR path is deliberately NOT done -- a
  # 60-second run finds nothing and grants false confidence (see fuzz/README.md
  # "When to run it"). But *compiling* is a different question: the three target
  # files and fuzz/Cargo.toml are otherwise built by nothing in CI, so the
  # harness can rot silently and be discovered broken exactly when it is needed.
  # `cargo check` on stable suffices -- nightly is only required to *run*
  # cargo-fuzz (-Zsanitizer=address), not to expand `fuzz_target!`.
  # Per-STEP gate for the same required-context-safe reason as jq/yq-drift.
  fuzz-build:
    name: fuzz harness compile check
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Compile-check the fuzz targets
        if: needs.gate.outputs.code == 'true'
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
