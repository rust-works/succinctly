name: CI

on:
  # `push` to `main` is the merge queue's own commit (merge method MERGE, so the
  # push SHA *is* the merge-group SHA) and was re-running every check the queue
  # had just passed. Since #3649 it runs only `perf-guard` (push-relative
  # comparison, #2117) -- unless the SHA has no successful `merge_group` run,
  # in which case it runs everything (see `gate` below). The coverage baseline
  # that PRs diff against is published by coverage-baseline.yml.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue leg (#310). `merge_group` is a distinct event from
  # `push`/`pull_request`: when a PR is queued, GitHub builds a throwaway
  # `gh-readonly-queue/main/*` ref (the PR replayed onto the latest `main`) and
  # expects the required contexts to report *there*. Without this trigger a
  # queued PR would hang on all six required checks until the queue's
  # `check_response_timeout_minutes` elapsed and then be dropped — so this must
  # be on `main` *before* the `merge_queue` rule is added to ruleset 11913990.
  # `checks_requested` is the only activity type today; pinning it keeps the
  # workflow specific if more are added later.
  merge_group:
    types: [checks_requested]

# Cancel a PR branch's in-progress run when it's pushed again (#3011); every
# merge-queue entry gets its own `gh-readonly-queue/main/pr-N-<sha>` ref, and a
# `main` push never shares a group with anything else, so neither is ever
# cancelled by this.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Path-split gate (#202). Docs/skills-only PRs skip the heavy 3-arch matrix and
  # coverage while still publishing every required status context, so they merge
  # in seconds without deadlocking branch protection. A single gate is the source
  # of truth for the split — no twin `ci-skip.yml` whose stub job names must be
  # hand-mirrored against this matrix (which would silently rot when the matrix or
  # protection set changes). Non-PR events (main pushes, merge-queue builds)
  # always take the full path — on a `merge_group` event the `paths-filter` step
  # self-skips and `decide` sets `code=true`, so whatever is about to become
  # `main` always gets the full required matrix (#310). No markdown is
  # `include_str!`-compiled here, but the doc set still scopes `*.md` to the repo
  # root only — never `**/*.md` — so anything not explicitly a doc runs full CI
  # (fail-safe).
  #
  # `retest` (#3649) is `false` only for a `push` whose SHA already has a
  # successful `merge_group` run of this workflow: the merge queue tested that
  # exact commit, so repeating the test matrices, Clippy, Format, docs and
  # drift checks adds nothing (they are enforced on PRs and merge groups, never
  # on pushes, so skipping them leaves the ruleset untouched). Jobs that skip
  # on it test `!= 'false'`, so an unset output (the lookup failing) runs
  # them: it fails towards testing. A push that bypassed the queue (an admin push) has no such run and gets the full suite.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read           # dorny/paths-filter lists the PR's files
      actions: read                 # `retest` looks up the SHA's merge_group run
    outputs:
      code: ${{ steps.decide.outputs.code }}
      retest: ${{ steps.dedupe.outputs.retest }}
      macos: ${{ steps.macos.outputs.macos }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.claude/skills/**'
              - '!changelog.d/**'    # fragments are .md, but nested, so `!*.md` misses them (#3920)
            # Where macOS can differ from Linux (#5699): Apple's libm vs glibc's last digit,
            # the local zone, the files with a `target_os = "macos"` cfg (`git grep -l
            # 'target_os = "macos"' -- '*.rs'`; add a new one here, or label the PR
            # `ci:macos`), the build script, dependency / toolchain / cargo config changes,
            # the deep-recursion test list, and the workflows. `build.rs` and `rust-toolchain*`
            # do not exist today; they are listed so adding one is covered.
            macos:
              - 'src/jq/math.rs'
              - 'src/jq/local_zone.rs'
              - 'src/bin/succinctly/address_space.rs'
              - 'src/bin/succinctly/malloc_arena.rs'
              - 'src/bin/succinctly/bench_runner/utils.rs'
              - 'src/bin/succinctly/compare/*.rs'
              - 'src/bin/succinctly/dsv_bench.rs'
              - 'src/bin/succinctly/jq_bench.rs'
              - 'src/bin/succinctly/yq_bench.rs'
              - '**/build.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - 'scripts/deep-recursion-tests.sh'
              - '.github/workflows/**'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

      # #5699: the macOS matrix runs in merge-group (and un-deduped `main` push) runs, and on a
      # PR only when it touches code where macOS can differ from Linux (the `macos` filter
      # above) or carries the `ci:macos` label. Labels are read live, not from the event
      # payload, so re-running the jobs after adding the label sees it. A failed lookup
      # fails towards testing.
      - id: macos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PATHS: ${{ steps.filter.outputs.macos }}
        run: |
          macos=true
          if [ "$EVENT" = "pull_request" ]; then
            macos=false
            if [ "$PATHS" = "true" ]; then
              macos=true
              echo "::notice::PR touches a macOS-sensitive path; running the macOS matrix (#5699)"
            elif ! labels=$(gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name'); then
              macos=true
              echo "::notice::could not read the PR's labels; running the macOS matrix (#5699)"
            elif grep -qx 'ci:macos' <<<"$labels"; then
              macos=true
              echo "::notice::PR carries the ci:macos label; running the macOS matrix (#5699)"
            fi
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

      - id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          retest=true
          if [ "$EVENT" = "push" ]; then
            # `status=success` filters on the run's conclusion. A failed lookup
            # leaves `passed` empty, which keeps retest=true.
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq '.total_count' || true)
            if [ "${passed:-0}" -gt 0 ] 2>/dev/null; then
              retest=false
              echo "::notice::$SHA already passed this workflow as a merge_group run; skipping the duplicate test matrices, lints and drift checks (#3649)"
            fi
          fi
          echo "retest=$retest" >> "$GITHUB_OUTPUT"

  # Drift detector for the yq golden fixtures (tests/data/yq-golden/): the
  # goldens are frozen oracle output, so this is the one job that re-checks
  # them against the pinned mikefarah/yq. Unlike the pre-#227 comparison
  # tests, a missing or wrong-version yq fails the check — it cannot silently
  # self-skip when it runs. The gate is applied per-STEP (not as a job-level
  # `if`) so that on the docs-only fast path every step skips but the job still
  # reports a genuine `success` rather than a `skipped` conclusion whose
  # branch-protection semantics vary — matching the required Test/Clippy/Format
  # jobs above, so this context is safe to mark required.
  yq-drift:
    name: yq golden drift check
    needs: gate
    # #3649: skipped on a `main` push the merge queue already tested (see `gate`).
    if: needs.gate.outputs.retest != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install pinned yq
        if: needs.gate.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat tests/data/yq-golden/YQ_VERSION)"
          # `gh release download` fetches through the API asset endpoint. The
          # github.com/<repo>/releases/download/ URL that curl used returned 504
          # for hours on 2026-11-08 while the API endpoint kept answering; the
          # loop covers the shorter blips.
          for attempt in 1 2 3 4 5; do
            if gh release download "${V}" -R mikefarah/yq -p yq_linux_amd64 \
              -O /usr/local/bin/yq --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not download yq ${V} after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          chmod +x /usr/local/bin/yq
          yq --version | grep -F "version ${V}"

      - name: Verify goldens against pinned yq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-yq-golden.sh --check

  # Drift detector for the jq golden fixtures (tests/data/jq-golden/): the
  # goldens are frozen oracle output, so this is the one job that re-checks
  # them against the pinned jqlang/jq. A missing or wrong-version jq fails the
  # check — it cannot silently self-skip when it runs. Per-STEP gate for the
  # same required-context-safe reason as yq-drift above (#300 mirrors #227).
  jq-drift:
    name: jq golden drift check
    needs: gate
    # #3649: skipped on a `main` push the merge queue already tested (see `gate`).
    if: needs.gate.outputs.retest != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        if: needs.gate.outputs.code == 'true'

      - name: Install pinned jq
        if: needs.gate.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat tests/data/jq-golden/JQ_VERSION)"
          # `gh release download` fetches through the API asset endpoint. The
          # github.com/<repo>/releases/download/ URL that curl used returned 504
          # for hours on 2026-11-08 while the API endpoint kept answering; the
          # loop covers the shorter blips.
          for attempt in 1 2 3 4 5; do
            if gh release download "${V}" -R jqlang/jq -p jq-linux-amd64 \
              -O /usr/local/bin/jq --clobber; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::could not download jq ${V} after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          chmod +x /usr/local/bin/jq
          jq --version | grep -F "${V}"

      - name: Verify goldens against pinned jq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-jq-golden.sh --check

      # Same idea for the error-message table (#356): the captured wording in
      # tests/data/jq-error-messages.tsv is oracle output too, and
      # tests/jq_error_message_tests.rs asserts both evaluators reproduce it.
      - name: Verify error messages against pinned jq
        if: needs.gate.outputs.code == 'true'
        run: ./scripts/sync-jq-error-messages.sh --check
