name: Doc lines

# The compliance limitation pages keep one sentence per source line, so PRs that
# each add a sentence to the same paragraph merge cleanly (#5048, STYLE-0014).
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/compliance/**/limitations.md'
      - 'scripts/doc_lines.py'
      - 'scripts/test_doc_lines.py'
      - '.github/workflows/doc-lines.yml'

permissions:
  contents: read

jobs:
  doc-lines:
    name: Doc lines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Unit-test the line script
        run: python3 scripts/test_doc_lines.py -v

      - name: No overlong prose line in the limitation pages
        run: python3 scripts/doc_lines.py check
