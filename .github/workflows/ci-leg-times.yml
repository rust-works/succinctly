name: CI leg times

# The report that flags a CI job whose time jumped (#5867) runs daily in scheduled.yml; its unit
# tests run here, on the pull requests that touch it, so a change to its thresholds or its issue
# handling is tested before it merges.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci_leg_times.py'
      - 'scripts/test_ci_leg_times.py'
      - '.github/workflows/ci-leg-times.yml'

permissions:
  contents: read

jobs:
  ci-leg-times:
    name: CI leg times
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Unit-test the report
        run: python3 scripts/test_ci_leg_times.py -v
