name: Scheduled

# Work that used to run on every `pull_request` and every `main` push in
# ci.yml, moved here by #3649 because it gates nothing and was the main source
# of macOS-runner saturation (the Team plan caps concurrent macOS jobs at 5):
#
#   * `upstream` -- the beta/nightly toolchain legs (#203). Upcoming-compiler
#     breakage does not depend on the PR that happens to meet it first, so a
#     daily run on `main` catches it just as well as ~125 runs a day did.
#   * `bench` -- `cargo bench --bench rank_select`. It uploads artifacts nobody
#     compares against a baseline; the deterministic regression signal is
#     ci.yml's `perf-guard` job.
#   * `ci-times` -- flags a CI job whose time has jumped well past its recent level
#     (#5867): the `no-std` legs ran at 2.5-3x for nine days (#5845) with every check
#     green.
#
# None is a required status check (the ruleset requires only Test x86_64 /
# ARM64 / macOS ARM64, Clippy, Format, Do Not Merge, Documentation and Skill
# manifest casing), so moving them off the PR path cannot hang a merge.
#
# `schedule` runs only on the default branch. `workflow_dispatch` runs any
# job on demand, e.g. to bisect a bench movement, to check a PR against the
# upcoming compilers before merging, or to ask `ci-times` for a report now.
on:
  schedule:
    - cron: '17 4 * * *'      # daily, 04:17 UTC -- off the hour, outside peak merge hours
  workflow_dispatch:

# A manual run must not cancel the scheduled one (or the reverse); two runs of
# the same ref queue behind each other instead.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# No `actions/cache` anywhere in this file, on purpose (#3649): each leg would
# save a ~0.5 GB `target/` cache per `Cargo.lock` hash, against a repository
# cap of 10 GB that ci.yml's PR-scoped caches already overrun, and a daily job
# gains almost nothing from a warm cache (the CLI build is ~30 s).
jobs:
  # Upstream-toolchain leg (#203). Runs the x86_64 test suite on beta and nightly
  # to catch upcoming-compiler breakage (lint changes, soundness fixes, stdlib
  # deprecations) before it reaches a release. x86_64 only. `nightly` is
  # advisory (`continue-on-error`) because it is the flakiest; `beta` failing
  # fails the run.
  # #3059: the 6 feature-flag `cargo test` invocations per toolchain leg are
  # mutually independent, so they are matrix legs rather than chained steps.
  upstream:
    name: Test (x86_64) (${{ matrix.rust }}, ${{ matrix.variant.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false                                   # beta breakage must not cancel nightly
      matrix:
        rust: [beta, nightly]
        variant:
          - name: cli-gated
            buildCli: true
            testCmd: cargo test --features cli --test yq_cli_tests --test yq_golden_tests --test yq_path_consistency_tests --test yaml_bench_suite_coverage --test dsv_cli_tests --test text_cli_tests --test json_validate_tests --test yaml_validate_tests --test cli_golden_tests --test cli_characterization_tests --test deep_nesting_valid_tests --test jq_cli_tests
          - name: bench-runner-gated
            buildCli: true
            testCmd: |
              cargo test --features cli,bench-runner --test orchestrate_cli_tests
              cargo test --features cli,bench-runner --lib cli::
          - name: default
            buildCli: false
            testCmd: cargo test --verbose
          - name: simd
            buildCli: false
            testCmd: cargo test --verbose --features simd
          - name: portable-popcount
            buildCli: false
            testCmd: cargo test --verbose --features portable-popcount
          # Same no_std cargo-test rationale as ci.yml's test-x86 (#2114).
          - name: no-std
            buildCli: false
            testCmd: cargo test --no-default-features --verbose
    continue-on-error: ${{ matrix.rust == 'nightly' }}   # beta fails the run; nightly is advisory
    env:
      # Same x86 SIMD runner contract as ci.yml's test-x86 (#193).
      SUCCINCTLY_EXPECT_SIMD: sse2,sse4.2,avx2,bmi2,popcnt
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build CLI (for integration tests)
        if: matrix.variant.buildCli
        run: cargo build --features cli --bin succinctly

      - name: Run tests
        run: ${{ matrix.variant.testCmd }}

  # #3059: the 3 `cargo bench` invocations per arch used to run back-to-back
  # in one job; matrixed over both arch and feature variant so they run in
  # parallel instead.
  bench:
    name: Bench (${{ matrix.platform.name }}, ${{ matrix.variant.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - name: ARM64-Linux
            runner: ubuntu-24.04-arm
            arch: arm64
          - name: ARM64-macOS
            runner: macos-latest
            arch: arm64-macos
        variant:
          - name: default
            args: ''
          - name: simd
            args: '--features simd'
          - name: portable
            args: '--features portable-popcount'
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Print CPU info
        run: |
          echo "=== CPU Info ==="
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            lscpu | grep -E "Model name|Architecture|CPU\(s\)|Flags" || true
            # Check for specific features
            echo "=== Feature Detection ==="
            if grep -q avx2 /proc/cpuinfo 2>/dev/null; then echo "AVX2: supported"; else echo "AVX2: not detected"; fi
            if grep -q popcnt /proc/cpuinfo 2>/dev/null; then echo "POPCNT: supported"; else echo "POPCNT: not detected"; fi
            if grep -q sve2 /proc/cpuinfo 2>/dev/null; then echo "SVE2: supported"; else echo "SVE2: not detected"; fi
            if grep -q svebitperm /proc/cpuinfo 2>/dev/null; then echo "SVE2-BITPERM: supported"; else echo "SVE2-BITPERM: not detected"; fi
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            sysctl -n machdep.cpu.brand_string || true
            system_profiler SPHardwareDataType | grep -E "Chip|Cores" || true
            echo "Note: Apple Silicon does not support SVE/SVE2"
          fi

      - name: Run benchmarks
        run: cargo bench --bench rank_select ${{ matrix.variant.args }} -- --noplot | tee bench-${{ matrix.variant.name }}.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.platform.arch }}-${{ matrix.variant.name }}
          path: bench-${{ matrix.variant.name }}.txt

  # #7959: the binary-size budget (tests/data/binary-size-budget.json) is not a pull-request gate: a PR
  # is held to `max_pr_growth` against its base binary, and ci.yml only reports the budget, so the slow
  # drift of many merges is caught here. Each leg measures the release binary main's newest push run of
  # ci.yml uploaded for its arch (`perf-guard-bin-<arch>-<sha>-<rustc key>`, found the way ci.yml's #5704
  # lookup finds it, so no fat-LTO build), stripped on the image its perf-guard leg strips on, and opens
  # one tracking issue per target that is over (label `binary-size`), or rewrites the body of the open
  # one. release.yml fails on the same budget. scripts/binary_size.py's `track` has the rules.
  binary-size:
    name: Binary size budget (${{ matrix.name }})
    # Reads this repository's own Actions artifacts; a fork has none, and would query ours.
    if: github.repository == 'rust-works/succinctly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - name: ARM64-Linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # As for `ci-times`: an unreadable API must not turn the whole Scheduled run red. The script's
    # tests run on pull requests (ci.yml's perf-guard job runs scripts/test_binary_size.py).
    continue-on-error: true
    permissions:
      contents: read
      actions: read                 # lists main's push runs and downloads their binary
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Main's head first; a push run that built no binary (a docs-only push, one still building, an
      # expired artifact) is passed over for the newest one that did. Only a `push` run of ci.yml on
      # `main` is a source, as in ci.yml's lookup. Any `rustc -V` key will do: this measures main's
      # binary as CI built it, not a baseline that must match this run's toolchain.
      - name: Find main's newest release binary
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARCH: ${{ matrix.name }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          RUNS=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=30" \
            --jq '.workflow_runs[] | select(.head_branch == "main") | "\(.id) \(.head_sha)"')
          while read -r id sha; do
            case "$sha" in *[!0-9a-f]*|"") continue ;; esac
            name=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
              --jq "[.artifacts[] | select((.expired | not) and (.name | startswith(\"perf-guard-bin-$ARCH-$sha-\")))][0].name // empty" || true)
            if [ -n "$name" ]; then
              {
                echo "artifact=$name"
                echo "run-id=$id"
                echo "sha=$sha"
                echo "head-sha=$HEAD_SHA"
              } >> "$GITHUB_OUTPUT"
              echo "Measuring $name from push run $id (main's head is $HEAD_SHA)"
              exit 0
            fi
          done <<< "$RUNS"
          echo "::error::no perf-guard-bin-$ARCH artifact in main's last 30 push runs of ci.yml"
          exit 1

      - name: Download main's release binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.find.outputs.artifact }}
          path: ${{ runner.temp }}/main-bin
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Track the budget
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          MEASURED_AT: >-
            main at ${{ steps.find.outputs.sha }} (main's head: ${{ steps.find.outputs.head-sha }}),
            artifact ${{ steps.find.outputs.artifact }} of
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find.outputs.run-id }}
        run: python3 scripts/binary_size.py track --binary "$RUNNER_TEMP/main-bin/succinctly" --target "$TARGET" --measured-at "$MEASURED_AT" --issue

  # #5867: a CI job can get several times slower and stay green. Compares the median time of each job in
  # the newest `merge_group` runs of ci.yml with its median over the two weeks before and, if one is
  # both 1.5x and two minutes slower, opens (or adds a comment to) the one open `ci-slowdown` issue.
  # Reads the Actions API only; never required, never blocks the queue. scripts/ci_leg_times.py has
  # the thresholds and why they are wide.
  ci-times:
    name: CI job times
    # Reads this repository's own Actions history; a fork has none, and would query ours.
    if: github.repository == 'rust-works/succinctly'
    runs-on: ubuntu-24.04
    # An unreadable API (a 5xx, a rate limit) must not turn the whole Scheduled run red: the beta
    # toolchain leg above shares it. The report's tests run on pull requests (ci-leg-times.yml).
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Flag a job that got much slower
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_leg_times.py report --issue

  # #7894 follow-up: ci.yml's perf-guard job only warns on a stale link-order list (it fails
  # release branches), so this reads the share from main's newest push run and opens, or rewrites
  # the body of, one "regenerate the link-order list" issue once it passes 4% (the limit is 5%).
  # No build: it reads the job log the perf guard already wrote.
  link-order:
    name: Link-order list share
    if: github.repository == 'rust-works/succinctly'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: File the regeneration once the list is nearly stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/link-order/watch.py --issue
