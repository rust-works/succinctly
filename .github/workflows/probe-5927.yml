name: probe 5927

# Throwaway: runs the script test on each runner image (#5927). Not to be merged.
on:
  pull_request:
    paths:
      - '.github/workflows/probe-5927.yml'

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test_ab_cli.py -v 2>&1 | tail -30
