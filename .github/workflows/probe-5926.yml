name: probe 5926

# Throwaway: the whole test suite on ubuntu-26.04 after trimming the libm goldens (#5926). Not to be merged.
on:
  pull_request:
    paths:
      - '.github/workflows/probe-5926.yml'

permissions:
  contents: read

jobs:
  probe:
    name: probe (ubuntu-26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Every test binary, no fail-fast
        run: |
          skip=$(scripts/deep-recursion-tests.sh skip-args)
          cargo test --no-fail-fast --features cli,simd,regex,serde -- $skip 2>&1 | tee /tmp/test.log | grep -E "^(test result|error|failures:|     Running|    [a-z_:0-9]+$)|FAILED|panicked" | grep -vE "ok\. " | head -150
          echo "=== summary"; grep -E "^test result" /tmp/test.log | sort | uniq -c | sort -rn | head -5
          ! grep -qE "^test result: FAILED|^error: " /tmp/test.log
