name: Coverage baseline

# Publishes the per-line coverage report of every commit on `main`, the baseline
# that ci.yml's pull-request `Coverage` jobs diff against (#3649).
#
# It is its own workflow, not a job in ci.yml, for two reasons:
#
#   * The PR job looks the artifact up by "newest *successful* run of the
#     workflow for the merge-base commit". In ci.yml that run also contained the
#     test matrices, Clippy and perf-guard, so a failing or cancelled job there
#     (13% of the last 100 main pushes) made the run unsuccessful and left a
#     published artifact unreachable. Here the run succeeds exactly when
#     coverage does.
#   * ci.yml serialised main pushes in one concurrency group with
#     `cancel-in-progress: false`, so a newer pending run replaced an older
#     pending one: those commits never ran coverage at all, and the rest ran
#     25-50 min after the merge. Every push has its own group here, so every
#     commit gets a baseline, about one coverage run after it lands.
#
# Runs on every push to `main`, docs-only ones included: a PR can fork from any
# main commit and needs that commit's baseline.
#
# ci.yml's pull-request `Coverage` jobs look the baseline up here (the `baseline-workflow` input
# of patchcov-action in .github/workflows/coverage.yml), and ci.yml no longer runs coverage on
# `push` at all. Both call coverage.yml, which runs the tests as shards and publishes the
# combined report (#5711). A PR forked from a commit that predates this workflow, or from one
# whose run here has not finished yet, uses the nearest ancestor's baseline; thin mode cannot
# rebuild one in a worktree any more, so a PR with none reachable gets a comment without deltas.
on:
  push:
    branches: [main]

concurrency:
  group: coverage-baseline-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage baseline (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
          - name: ARM64
            runner: ubuntu-24.04-arm
    # The called workflow's report job asks for `pull-requests: write` (its sticky comment, which a
    # push never posts), and a called workflow cannot hold more than its caller grants it.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/coverage.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
