name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Prebuilt binary via taiki-e/install-action (cacheable), rather than
      # `cargo install cargo-audit`, which recompiles from source every run.
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit

      # fuzz/ and bench-compare/ are separate cargo workspaces (own
      # Cargo.lock), deliberately isolated from the root dependency graph --
      # see fuzz/Cargo.toml's header comment. CI compiles them but the
      # default `cargo audit` above only ever looks at the root Cargo.lock.
      - name: Run cargo-audit (fuzz workspace)
        run: cargo audit -f fuzz/Cargo.lock

      - name: Run cargo-audit (bench-compare workspace)
        run: cargo audit -f bench-compare/Cargo.lock

  deny:
    name: Dependency Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # #6652: EmbarkStudios/cargo-deny-action builds a Docker image that pipes
      # `curl` of github.com/<repo>/releases/download/ into `tar`, so the 504 that
      # URL answered for hours on 2026-11-08 failed this job ("gzip: invalid
      # magic"). Install the release the action pinned (v2.1.1 -> 0.20.2) through
      # the API asset endpoint instead, and run cargo-deny directly: once for the
      # root deny.toml, then once per isolated workspace with its own config
      # (root deny.toml is intentionally tuned to the shipped crate's dependency
      # tree only).
      - name: Install cargo-deny
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_DENY_VERSION: 0.20.2
        run: |
          dir="$RUNNER_TEMP/cargo-deny-install"
          mkdir -p "$dir/bin"
          ./scripts/gh-release-download.sh EmbarkStudios/cargo-deny "${CARGO_DENY_VERSION}" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$dir/cargo-deny.tar.gz"
          tar -xzf "$dir/cargo-deny.tar.gz" -C "$dir"
          install "$dir/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" "$dir/bin/cargo-deny"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/cargo-deny" --version

      - name: Dependency Policy
        run: cargo deny check all

      - name: Dependency Policy (fuzz workspace)
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check all

      - name: Dependency Policy (bench-compare workspace)
        run: cargo deny --manifest-path bench-compare/Cargo.toml --config bench-compare/deny.toml check all

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog (verified secrets)
        uses: trufflesecurity/trufflehog@main
        with:
          # lob excluded: its key-shape regex (test_/live_ + alnum) coincidentally
          # matches Rust test fn names like `test_array_keys_unsorted_lazy_output_684`,
          # and Lob's test-mode verification API "verifies" them regardless (#688).
          extra_args: --only-verified --exclude-detectors=lob
