name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ env.RELEASE_VERSION }}
    steps:
    - name: Get the release version from the tag
      shell: bash
      if: env.RELEASE_VERSION == ''
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "version is: ${{ env.RELEASE_VERSION }}"
    - name: Create GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        release_name: ${{ env.RELEASE_VERSION }}
        draft: false
        prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        build: [linux-x64, linux-arm64, macos-arm64, windows]
        include:
        - build: linux-x64
          # #5926: deliberately not the newest image, unlike the CI jobs. The shipped binary links
          # the glibc of the image that builds it and runs only where the host's glibc has every
          # symbol version it references, so a newer image can raise the floor above what Ubuntu
          # 24.04 and Debian 12 hosts have. Moving it is a release-policy decision, not a CI one.
          os: ubuntu-24.04
          rust: stable
          target: x86_64-unknown-linux-gnu
          archive-name: succinctly-linux-x64.tar.gz
          # #5035: POPCNT for every per-word popcount (-2% to -3% median end to end, -20% on
          # structure-heavy YAML on a Ryzen 9 7950X). The binary checks for the instruction at
          # startup and says what it needs; see docs/guides/release.md.
          rustflags: -C target-feature=+popcnt
        - build: linux-arm64
          os: ubuntu-24.04-arm
          rust: stable
          target: aarch64-unknown-linux-gnu
          archive-name: succinctly-linux-arm64.tar.gz
        - build: macos-arm64
          os: macos-latest
          rust: stable
          target: aarch64-apple-darwin
          archive-name: succinctly-macos-arm64.tar.gz
        - build: windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          archive-name: succinctly-windows-x64.zip
          rustflags: -C target-feature=+popcnt
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.target }}

    - name: Build release binary
      env:
        # Empty for the aarch64 builds, which count bits with NEON `cnt` already.
        RUSTFLAGS: ${{ matrix.rustflags }}
      run: cargo build --verbose --release --features cli --target ${{ matrix.target }}

    - name: Strip release binary (linux and macos)
      if: matrix.build != 'windows'
      run: strip "target/${{ matrix.target }}/release/succinctly"

    - name: Build archive
      shell: bash
      run: |
        mkdir archive
        cp LICENSE README.md archive/
        if [ "${{ matrix.build }}" = "windows" ]; then
          cp "target/${{ matrix.target }}/release/succinctly.exe" archive/
          cd archive
          7z a "${{ matrix.archive-name }}" *
        else
          cp "target/${{ matrix.target }}/release/succinctly" archive/
          cd archive
          tar czf "${{ matrix.archive-name }}" *
        fi

    - name: Upload release archive
      uses: actions/upload-release-asset@v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: archive/${{ matrix.archive-name }}
        asset_name: ${{ matrix.archive-name }}
        asset_content_type: application/octet-stream

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    needs: [create-release, build-release]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Publish
      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
