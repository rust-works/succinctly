name: Coverage
description: >-
  Instrumented test run, coverage report and (on a pull request) the sticky
  patch-coverage comment, shared by ci.yml (pull requests) and
  coverage-baseline.yml (pushes to main, which publish the baseline artifact
  that pull requests diff against). Run it after `actions/checkout` with
  `fetch-depth: 0`. One definition so the two workflows cannot drift apart on
  the pinned patchcov version, the test arguments or the coverage gate (#3649).

inputs:
  name:
    description: 'Matrix leg name (x86_64 or ARM64); suffixes the artifact names and the comment header'
    required: true
  use-prebuilt:
    description: "Whether to download a prebuilt patchcov binary ('true') or build it from source ('false')"
    required: true
  baseline-workflow:
    description: >-
      Workflow file whose newest successful run for the PR's merge-base holds the baseline artifact.
      coverage-baseline.yml publishes it from a push-only run that concludes on coverage alone (#3649).
    required: false
    default: coverage-baseline.yml
  reclaim-below-gib:
    description: >-
      x86_64 only: free the unused hosted toolchains before the run only when `/` has less than this
      many GiB free (a whole number). The default leaves today's runner image, which starts with more,
      to skip the step (#3750).
    required: false
    default: '75'
  pool-profile-files:
    description: >-
      'true' merges the raw profile files of the processes the tests spawn into a pool of one file per
      CPU per binary instead of leaving one file per process (30,814 files, 47 GiB per run on 2026-10-04),
      by setting LLVM_PROFILE_FILE_NAME for the rest of the job. Any value but 'true' or 'false' fails.
      The default 'false' keeps cargo-llvm-cov's per-process files (#3750).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # #3585: from ~03:20 UTC on 2026-10-02 `Coverage (x86_64)` died on every PR
    # after 30-31 minutes with `No space left on device` raised by the runner
    # worker's own log file, no test failing, while `Coverage (ARM64)` (a
    # different image) passed on the same commits. The instrumented build plus
    # a profile file per spawned test process leaves little headroom on the
    # hosted `ubuntu-latest` disk, so reclaim the multi-GB toolchains this job
    # never uses (the Rust toolchain lives under the runner's home and is
    # untouched) before the action starts. x86_64 only: ARM64 passes without it.
    #
    # #3750: the image has since regained room (86 GiB free before this step on
    # 2026-10-04, 109 GiB after it), and the step cost 67-108 s of every x86_64
    # run to free space the run did not need. A run grew used space by ~52 GiB,
    # so it now reclaims only when less than `reclaim-below-gib` (75: that growth
    # plus ~20 GiB of margin) is free. The two `df` lines stay either way, so a
    # log still says how much room the run started with, and the sampler below
    # still reports how close it came (and warns when it came within 25 GiB).
    #
    # That sizing covers the head run only. A pull request whose merge-base and
    # first-parent ancestors have no published baseline makes the action build
    # a second instrumented tree in a worktree on the same disk, a path no
    # sampled run has taken, so its peak is not known. If one ever dies with
    # `No space left on device`, raise `reclaim-below-gib` above the image's
    # free space (100 reclaims every run, as before) and read the run's
    # profile-file figures from profraw-stats.sh to size it properly.
    - name: Reclaim disk space (x86_64, only when tight)
      if: inputs.name == 'x86_64'
      shell: bash
      env:
        RECLAIM_BELOW_GIB: ${{ inputs.reclaim-below-gib }}
      run: |
        df -h /
        # At most six digits: a longer number overflows the shell's 64-bit
        # arithmetic below and wraps negative, which would silently skip.
        case "$RECLAIM_BELOW_GIB" in
          '' | *[!0-9]* | [0-9][0-9][0-9][0-9][0-9][0-9][0-9]*)
            echo "::error::reclaim-below-gib must be a whole number of GiB with at most six digits, got '$RECLAIM_BELOW_GIB'"
            exit 1
            ;;
        esac
        avail_kb=$(df --output=avail -k / | tail -1 | tr -d ' ')
        # 10#: a leading zero would otherwise read as octal.
        threshold_kb=$((10#$RECLAIM_BELOW_GIB * 1048576))
        if [ "$avail_kb" -ge "$threshold_kb" ]; then
          echo "reclaim: skipped, $((avail_kb / 1048576)) GiB free on / is not below the $((10#$RECLAIM_BELOW_GIB)) GiB threshold"
        else
          echo "reclaim: running, $((avail_kb / 1048576)) GiB free on / is below the $((10#$RECLAIM_BELOW_GIB)) GiB threshold"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
        fi
        df -h /

    # Sample the free space every 20 s so a passing run says how close it came.
    # A failing run cannot report (the runner dies writing its own log), which
    # is why the headroom above is printed *before* the action starts.
    - name: Sample free disk space
      shell: bash
      run: |
        samples="$RUNNER_TEMP/df-avail-kb"
        nohup bash -c "while :; do df --output=avail -k / | tail -1 >> '$samples'; sleep 20; done" >/dev/null 2>&1 &

    # #3750 B1: opt-in pooling of the raw profile files. cargo-llvm-cov's `show-env`
    # (which every step of the action evals) ignores a preset LLVM_PROFILE_FILE but
    # honours LLVM_PROFILE_FILE_NAME, which replaces its default
    # `<package>-%p-%Nm.profraw`. Dropping the `%p` is what pools: the processes of
    # one binary then merge, at exit, into `%Nm` = N files per binary (the slot is
    # pid % N), with N the runner's CPU count, as in cargo-llvm-cov's own default.
    # The name goes through $GITHUB_ENV and only when pooling is on: the default
    # path never exports it, not even empty (which cargo-llvm-cov 0.9.1 reads as
    # unset but a later release need not), and every later step, the ones nested in
    # the action below included, is certain to see it. profraw-stats.sh fails the
    # run if pooling was asked for and the files are not pooled.
    - name: Pool raw profile files (when enabled)
      shell: bash
      env:
        POOL_PROFILE_FILES: ${{ inputs.pool-profile-files }}
      run: |
        case "$POOL_PROFILE_FILES" in
          true)
            name="profile-%$(nproc)m.profraw"
            echo "LLVM_PROFILE_FILE_NAME=$name" >> "$GITHUB_ENV"
            echo "pooling raw profile files: LLVM_PROFILE_FILE_NAME=$name"
            ;;
          false) ;;
          *)
            echo "::error::pool-profile-files must be 'true' or 'false', got '$POOL_PROFILE_FILES'"
            exit 1
            ;;
        esac

    - uses: action-works/patchcov-action@v1
      with:
        # Pin patchcov itself (#3873, #3880). 0.1.1 carries the extracted
        # coverage engine: `.patchcov/config.yaml` discovery and the symmetric
        # ignore list mask popcount's CPU flap (#302); patience diff preserves
        # patch attribution on repetitive evaluator refactors (#1554); source
        # coverage `tolerate` / `tolerate-line` / `end` markers mask
        # runtime CPU and unreachable-line variance (#2467).
        # It also ships prebuilt Linux x86_64 + ARM64 binaries (#3750), avoiding
        # cargo install on cache misses, and `patchcov merge` for future shards.
        # Keep >= 0.1.1 for these capabilities. The migration from omni-dev's
        # coverage engine was verified against omni-dev 0.46.0 with real main
        # lcov artifacts and mutation checks;
        # see docs/guides/developer.md "Patchcov migration verification".
        version: 0.1.1
        use-prebuilt-binary: ${{ inputs.use-prebuilt }}
        test-args: --features cli,simd,regex,serde --workspace
        # #3750: logs how many raw profile files the run left and how big they
        # are, before the lcov step merges them, and fails a run that asked for
        # pooling (`pool-profile-files`) whose files are not pooled. While pooling
        # is on this is the only check that it took effect: delete this line and
        # profraw-stats.sh only together with that input.
        # Validate every Rust marker before reporting; documentation examples
        # are outside this glob and are not executable coverage annotations.
        extra-test-commands: |
          patchcov lint-markers --include 'src/**/*.rs'
          bash "${{ github.action_path }}/profraw-stats.sh"
        fail-under-lines: 55   # floor a few pts below local llvm-cov (ARM: 59.58% lines)
        # fail-under-patch left unset → report-only initially
        # Where the baseline is looked up: the newest *successful* run of this
        # workflow for the merge-base commit. ci.yml's push run also holds the
        # test matrices and perf-guard, so an unrelated failing or cancelled job
        # there (13% of recent main pushes) leaves a published artifact
        # unreachable and the PR rebuilds the baseline (~9.5 min) -- which is
        # why coverage-baseline.yml exists (#3649).
        baseline-workflow: ${{ inputs.baseline-workflow }}
        baseline-artifact-name: coverage-baseline-${{ inputs.name }}
        artifact-name: coverage-summary-${{ inputs.name }}
        comment-header: coverage-${{ inputs.name }}

    - name: Report disk headroom
      if: always()
      shell: bash
      run: |
        df -h /
        if [ -s "$RUNNER_TEMP/df-avail-kb" ]; then
          lowest_kb=$(sort -n "$RUNNER_TEMP/df-avail-kb" | head -1 | tr -d ' ')
          echo "lowest free space sampled: $(awk -v k="$lowest_kb" 'BEGIN {printf "%.1f GiB", k/1048576}')"
          # #3750: the reclaim above is skipped on most runs now, and the run's
          # disk use grows with the number of spawned test processes, so the
          # margin can erode without any run failing. Surface it on the checks
          # page while a run still survives, not only after #3585 comes back.
          if [ "$lowest_kb" -lt "$((25 * 1048576))" ] 2>/dev/null; then
            echo "::warning::lowest free disk space was under 25 GiB; raise reclaim-below-gib in .github/actions/coverage/action.yml before this run's disk use causes ENOSPC (#3750)"
          fi
        fi
