# #1670: a bare `Vec::with_capacity`/`String::with_capacity` sized by a
# product (or otherwise generator-controlled magnitude) of independently
# controlled lengths has caused four independent infallible-allocation
# panics/aborts (#1017, #1612, #1634, #1669) -- each found only by a human
# or review pass noticing the pattern by eye. Disallowed crate-wide here;
# `src/lib.rs` and each `src/bin/**/main.rs` opt back out
# (`#![allow(clippy::disallowed_methods)]`) since the vast majority of
# `with_capacity` call sites outside `src/jq/eval.rs`/`eval_generic.rs`
# size from a single collection's own length and were never part of this
# bug shape; `eval.rs`/`eval_generic.rs` re-enable it
# (`#![warn(clippy::disallowed_methods)]`) since that is where the pattern
# has recurred every time. A legitimate single-length site in those two
# files goes through `vec_with_capacity`/`string_with_capacity`
# (`src/jq/eval.rs`) instead of the raw method, so only a *product* of
# lengths (the actual danger) shows up as a disallowed raw call.
disallowed-methods = [
    { path = "alloc::vec::Vec::with_capacity", reason = "use vec_with_capacity (single length) or try_reserve_product (a product of lengths) -- see #1670" },
    { path = "alloc::string::String::with_capacity", reason = "use string_with_capacity (single length) -- a product-sized String::with_capacity is the same #1670 bug shape as Vec's" },
]
