# Coverage config for `patchcov diff` (the sticky PR comment posted by
# the `Coverage (x86_64)` / `Coverage (ARM64)` jobs in .github/workflows/ci.yml, via
# the report job of .github/workflows/coverage.yml).
#
# Requires the patchcov version pinned in .github/workflows/coverage.yml.
# Migrated from omni-dev coverage config (#3873); the diff ignore-list schema
# and filtering semantics are unchanged.
diff:
  # Repo-relative path regexes, unanchored (partial match), applied after
  # --strip-prefix normalisation — same semantics as the
  # `--ignore-filename-regex` flag, with which this list is set-unioned.
  #
  # Only files whose coverage is *inherently non-deterministic across runs*
  # and cannot be fenced with a `tolerate` region belong here: a region gated
  # on a runtime CPU-feature check (not a `#[cfg]`) is compiled into the
  # denominator on every run but executed only on a host whose CPU has the
  # instruction. When the `main` baseline run and the PR-head
  # run draw different runner CPUs, the file moves with no source change.
  # Matching files are dropped from *both* reports before the diff, so they can
  # no longer produce a phantom entry in the "unchanged file(s) also moved"
  # note. See CONTRIBUTING.md "SIMD CI coverage" and succinctly#302.
  ignore-filename-regex: []

  # Narrowed from a whole-file entry (#2467). `src/bits/popcount.rs` used to be
  # listed here: ~30 lines behind `is_x86_feature_detected!("avx512vpopcntdq")`
  # made it report ~93% on a capable host and ~66% otherwise -- a +/-26pp swing
  # observed on unrelated PRs (#287, #357) -- and the exclusion also dropped the
  # file's other ~440 lines from the reported total. The x86 runners are
  # usually Zen 3 (EPYC 7763, no AVX-512) but the fleet is not CPU-homogeneous,
  # and `SUCCINCTLY_EXPECT_SIMD` intentionally omits `avx512vpopcntdq`, so the
  # swing cannot be pinned away. The CPU-gated regions (the AVX-512 kernel and
  # its dispatch, the two tests that return early without the CPU feature) are
  # now wrapped in coverage `tolerate` markers directly in the source: the file
  # keeps contributing its real coverage to the total, and only the CPU-gated
  # delta is masked.

  # Deliberately NOT excluded, contrary to the illustrative list in
  # rust-works/omni-dev#1398:
  #
  #   src/dsv/simd/**, src/yaml/simd/**, src/json/simd/**
  #     Their runtime dispatch gates on avx2 / bmi2 / sve2 / sve2-bitperm only —
  #     every one of which the test legs pin via `SUCCINCTLY_EXPECT_SIMD`, so
  #     they are deterministic on the runner fleet, not CPU-conditional noise.
  #
  #   src/util/simd/x86.rs
  #     Has an `avx512f` arm inside `detect_fast_bmi2` (the `has_fast_bmi2`
  #     early return) that flaps by the same runtime-CPU-detection mechanism —
  #     10 lines flip, net 9 covered lines, depending on whether the runner
  #     draws a host with avx512f (#2449; this paragraph previously
  #     understated the flap as "~1-2 lines"). Rather than excluding the whole
  #     ~230-line file, the flapping region is wrapped in a
  #     coverage `tolerate` marker directly in
  #     src/util/simd/x86.rs (needs the patchcov pinned in
  #     .github/workflows/coverage.yml; rust-works/omni-dev#1593, succinctly#2467): the file
  #     keeps contributing its real coverage to the total, and only the
  #     CPU-gated delta is masked.
  #
  # Keep this list to files with *observed* flap: an entry here removes the file
  # from the reported total as well, so over-excluding quietly shrinks what the
  # comment measures.
